            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="385.5" y="1429.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.1118"
                  x="385.5" y="1446.333">- &#25237;&#12370;&#12425;&#12428;&#12383;&#29289;&#29702;&#25369;&#21205;&#65288;vx,
                vy, vz, z&#65289;&#12392;&#12289;&#31354;&#20013;&#26178;&#12398;&#24433;&#12398;&#25551;&#30011;&#12434;&#31649;&#29702;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="590.8525"
                  x="385.5" y="1463.624">- &#30528;&#22320;&#12377;&#12427;&#12392;&#23566;&#28779;&#32218;&#65288;fuseDurationMs&#65289;&#12434;&#38283;&#22987;&#12375;&#12289;&#26178;&#38291;&#32076;&#36942;&#12414;&#12383;&#12399;&#34909;&#31361;&#12391;
                startExplosion &#12434;&#21628;&#12403;&#20986;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="509.2026"
                  x="385.5" y="1480.915">- startExplosion &#12399;&#29190;&#30330;&#12450;&#12491;&#12513;&#12434;&#38283;&#22987;&#12375;&#12289;&#31227;&#21205;&#12539;&#25342;&#24471;&#12434;&#28961;&#21177;&#21270;&#12375;&#12289;&#36895;&#24230;&#12434;&#12522;&#12475;&#12483;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="881.9053"
                  x="385.5" y="1498.2061">- giveExplosionDamage &#12399;&#12518;&#12540;&#12470;&#12540;&#12395;&#24540;&#12376;&#12390;&#12514;&#12531;&#12473;&#12479;&#12540;&#12414;&#12383;&#12399;&#12503;&#12524;&#12452;&#12516;&#12540;&#12395;&#19968;&#24230;&#12384;&#12369;&#12480;&#12513;&#12540;&#12472;&#12434;&#19982;&#12360;&#12289;&#12381;&#12398;&#24460;&#24403;&#12383;&#12426;&#21028;&#23450;&#12434;&#28961;&#21177;&#21270;&#12375;&#12390;&#29190;&#24382;&#12434;&#38500;&#21435;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="559.73"
                  x="385.5" y="1515.4971">- draw &#12399;&#39640;&#24230;&#12458;&#12501;&#12475;&#12483;&#12488;&#12392;&#12289;&#31354;&#20013;&#26178;&#12395;&#20219;&#24847;&#12398;&#22320;&#38754;&#24433;&#12434;&#25551;&#30011;&#12375;&#12390;&#12473;&#12503;&#12521;&#12452;&#12488;&#12434;&#12524;&#12531;&#12480;&#12522;&#12531;&#12464;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="579.9409"
                  x="385.5" y="1532.7881">- &#25342;&#24471;&#12289;&#25152;&#25345;&#65295;&#25237;&#25842;&#29992;&#12473;&#12503;&#12521;&#12452;&#12488;&#12398;&#12469;&#12509;&#12540;&#12488;&#12392;&#12289;&#22402;&#30452;&#36895;&#24230;&#12398;&#12463;&#12521;&#12531;&#12503;&#65288;&#19978;&#38480;&#19979;&#38480;&#12398;&#21046;&#24481;&#65289;&#12434;&#20633;&#12360;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="385.5" y="1550.0791">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.8677"
                  x="385.5" y="1567.3701">- Manages thrown physics (vx, vy, vz, z) and shadow rendering while airborne.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="586.7202"
                  x="385.5" y="1584.6611">- On landing starts a fuse (fuseDurationMs) and calls startExplosion when time
                elapses or on collision.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="539.0557"
                  x="385.5" y="1601.9521">- startExplosion begins explosion animation, disables movement/pickup, and
                resets velocities.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="775.3979"
                  x="385.5" y="1619.2432">- giveExplosionDamage applies damage once to monsters or player depending on
                user, then disables collision and removes the bomb.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="481.9966"
                  x="385.5" y="1636.5342">- draw renders sprite with altitude offset and optional ground shadow while
                airborne.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.1777"
                  x="385.5" y="1653.8252">- Supports pickup, held/throw sprites, and vertical velocity clamping.
            </text>
        </g><!--class CollisionChecker-->
