            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="842" y="118.542">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.9409"
                  x="842" y="135.833">- &#26041;&#21521;&#12539;&#12501;&#12524;&#12540;&#12512;&#21029;&#12473;&#12503;&#12521;&#12452;&#12488;&#37197;&#21015;&#12434;&#20445;&#25345;&#12377;&#12427;&#25277;&#35937;&#25237;&#23556;&#29289;&#22522;&#24213;&#12463;&#12521;&#12473;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.5527"
                  x="842" y="153.124">- set() &#12391;&#21021;&#26399;&#37197;&#32622;&#12539;&#21521;&#12365;&#12539;&#20351;&#29992;&#32773;&#12434;&#35373;&#23450;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="702.7554"
                  x="842" y="170.415">- update() &#12399;&#31227;&#21205;&#12539;&#34909;&#31361;&#21028;&#23450;&#65288;&#12503;&#12524;&#12452;&#12516;&#12540;
                or &#12514;&#12531;&#12473;&#12479;&#12540;&#65289;&#12539;&#12497;&#12540;&#12486;&#12451;&#12463;&#12523;&#29983;&#25104;&#12539;&#23551;&#21629;&#31649;&#29702;&#12434;&#34892;&#12356;&#12289;&#24403;&#12383;&#12426;&#12391;&#28961;&#21177;&#21270;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312" x="842"
                  y="187.7061">- move() &#12399;&#26041;&#21521;&#12395;&#24540;&#12376;&#12383;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12398;&#26356;&#26032;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.7808"
                  x="842" y="204.9971">- updateAnimation() &#12399;&#12473;&#12503;&#12521;&#12452;&#12488;&#12450;&#12491;&#12513;&#12540;&#12471;&#12519;&#12531;&#12434;&#36914;&#12417;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.3882"
                  x="842" y="222.2881">- draw() &#12399;&#29694;&#22312;&#12398;&#26041;&#21521;&#12392;&#12501;&#12524;&#12540;&#12512;&#12395;&#24540;&#12376;&#12383;&#12473;&#12503;&#12521;&#12452;&#12488;&#12434;&#30011;&#38754;&#12395;&#25551;&#30011;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="842" y="239.5791">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="486.2432"
                  x="842" y="256.8701">- Abstract projectile base class that stores direction- and frame-specific sprite
                arrays.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.2959"
                  x="842" y="274.1611">- set() initializes world position, direction, alive state, and the user (owner).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="893.1406"
                  x="842" y="291.4521">- update() handles movement, collision checks (against player or monsters),
                particle generation, lifespan management, and deactivates the projectile on hit.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.3086"
                  x="842" y="308.7432">- move() updates world coordinates according to the current direction.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.4478"
                  x="842" y="326.0342">- updateAnimation() advances the sprite animation frames.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="494.2412"
                  x="842" y="343.3252">- draw() renders the sprite corresponding to the current direction and animation
                frame.
            </text>
        </g><!--link Projectile to Entity-->
