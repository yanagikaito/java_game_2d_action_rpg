            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="660.1118"
                  x="477" y="376.333">- &#25237;&#12370;&#12425;&#12428;&#12383;&#12392;&#12365;&#12398;&#25918;&#29289;&#32218;&#36939;&#21205;&#65288;vx,
                vy, vz, z&#65289;&#12289;&#24433;&#12398;&#25551;&#30011;&#12289;&#25342;&#24471;&#65295;&#30528;&#22320;&#29366;&#24907;&#12289;&#21106;&#12428;&#12427;&#12450;&#12491;&#12513;&#12540;&#12471;&#12519;&#12531;&#12434;&#20966;&#29702;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.1226"
                  x="477" y="393.624">- updateAnimation &#12399;&#21106;&#12428;&#12390;&#12356;&#12394;&#12356;&#12392;&#12365;&#12395;&#12473;&#12503;&#12521;&#12452;&#12488;&#12501;&#12524;&#12540;&#12512;&#12434;&#36914;&#12417;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="520.749"
                  x="477" y="410.915">- startShatter &#12399;&#21106;&#12428;&#12427;&#12471;&#12540;&#12465;&#12531;&#12473;&#12434;&#38283;&#22987;&#12375;&#12289;&#36939;&#21205;&#12420;&#24403;&#12383;&#12426;&#21028;&#23450;&#12398;&#12501;&#12521;&#12464;&#12434;&#12522;&#12475;&#12483;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.4624"
                  x="477" y="428.2061">- giveShatterDamageAndSpawnFragments &#12399;&#36817;&#25509;&#12377;&#12427;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#12395;&#12480;&#12513;&#12540;&#12472;&#12434;&#19982;&#12360;&#12289;&#24403;&#12383;&#12426;&#21028;&#23450;&#12434;&#28961;&#21177;&#21270;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="515.6646"
                  x="477" y="445.4971">- &#25152;&#25345;&#26178;&#65295;&#25237;&#25842;&#26178;&#12398;&#12473;&#12503;&#12521;&#12452;&#12488;&#12434;&#25552;&#20379;&#12375;&#12289;&#39640;&#12373;
                z &#12392;&#24433;&#12434;&#32771;&#24942;&#12375;&#12383;&#25551;&#30011;&#12525;&#12472;&#12483;&#12463;&#12434;&#20633;&#12360;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="477" y="462.7881">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="576.6592"
                  x="477" y="480.0791">- Handles thrown parabolic physics, shadow rendering, pickup/landing states, and
                shatter animation.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2031"
                  x="477" y="497.3701">- updateAnimation advances sprite frames when not shattering.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.5703"
                  x="477" y="514.6611">- startShatter begins the shatter sequence and resets motion/collision flags.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="575.9419"
                  x="477" y="531.9521">- giveShatterDamageAndSpawnFragments applies damage to nearby entities and
                disables collision.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="477.6484"
                  x="477" y="549.2432">- Provides held/throw sprites and draw logic that accounts for height z and
                shadow.
            </text>
