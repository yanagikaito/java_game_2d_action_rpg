                  x="1753.5" y="1389.6611">- On collision or tile impact starts shatter sequence that spawns fragments
                and deals damage once.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="735.5981"
                  x="1753.5" y="1406.9521">- giveShatterDamageAndSpawnFragments handles damage, disables collision, and
                spawns/drops loot (coins, bombs, or items).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.9121"
                  x="1753.5" y="1424.2432">- Supports held/throw sprites, pick-up handling, and life-based shatter
                fallback.
            </text>
        </g><!--class Player-->
