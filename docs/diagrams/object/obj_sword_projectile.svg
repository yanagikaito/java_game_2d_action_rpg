            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.2681"
                  x="455" y="231.4971">- getPrototype &#12399;&#20877;&#21033;&#29992;&#12398;&#12383;&#12417;&#12398;&#31777;&#26131;&#12394;&#12471;&#12531;&#12464;&#12523;&#12488;&#12531;&#65295;&#12503;&#12525;&#12488;&#12479;&#12452;&#12503;&#12450;&#12463;&#12475;&#12469;&#12434;&#23455;&#35013;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="455" y="248.7881">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.9243"
                  x="455" y="266.0791">- Directional sword projectile with 3-frame sprites.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="555.6484"
                  x="455" y="283.3701">- Loads/resizes sprites per direction; acts as a Projectile (movement/collision
                handled by parent).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="930.6743"
                  x="455" y="300.6611">- onFire(direction) prepares a representative sprite, generates/caches a glow
                image, computes white-pixel centers, and creates a SwordAuraEffect for visual aura.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="666.3198"
                  x="455" y="317.9521">- update delegates to parent and updates the aura effect; draw renders the
                representative sprite and the aura effect.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.374"
                  x="455" y="335.2432">- getPrototype implements a simple singleton/prototype accessor for reuse.
            </text>
