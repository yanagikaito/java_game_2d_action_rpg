            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="847.9644"
                  x="455" y="196.915">- onFire(direction) &#12399;&#20195;&#34920;&#12473;&#12503;&#12521;&#12452;&#12488;&#12434;&#28310;&#20633;&#12375;&#12289;&#12464;&#12525;&#12540;&#30011;&#20687;&#12434;&#29983;&#25104;&#12539;&#12461;&#12515;&#12483;&#12471;&#12517;&#12375;&#12289;&#30333;&#12500;&#12463;&#12475;&#12523;&#12398;&#20013;&#24515;&#28857;&#12434;&#31639;&#20986;&#12375;&#12390;
                SwordAuraEffect &#12434;&#29983;&#25104;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="668.1035"
                  x="455" y="214.2061">- update &#12399;&#35242;&#12463;&#12521;&#12473;&#12395;&#20966;&#29702;&#12434;&#22996;&#35698;&#12375;&#12388;&#12388;&#12458;&#12540;&#12521;&#12456;&#12501;&#12455;&#12463;&#12488;&#12434;&#26356;&#26032;&#12375;&#12289;draw
