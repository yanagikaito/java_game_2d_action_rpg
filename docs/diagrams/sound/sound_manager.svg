                  x="1100" y="281.833">- SE&#65288;&#21177;&#26524;&#38899;&#65289;&#12392;BGM&#12398;&#20877;&#29983;&#12434;&#21336;&#19968;&#12473;&#12524;&#12483;&#12489;&#12398;IO&#23455;&#34892;&#27231;&#27083;&#12391;&#31649;&#29702;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="592.9473"
                  x="1100" y="299.124">- Clip&#12434;&#12461;&#12515;&#12483;&#12471;&#12517;&#12375;&#12390;&#20877;&#21033;&#29992;&#12377;&#12427;&#65307;&#12503;&#12522;&#12525;&#12540;&#12489;&#12289;&#21363;&#26178;BGM&#20999;&#26367;&#12289;&#20572;&#27490;&#12289;&#12501;&#12455;&#12540;&#12489;&#12450;&#12454;&#12488;&#12395;&#23550;&#24540;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="491.8735"
                  x="1100" y="316.415">- &#38899;&#37327;&#12399;FloatControl&#12391;&#25201;&#12358;&#65288;&#32218;&#24418;&#20516;
                &#8594; dB&#22793;&#25563;&#65289;&#65307;&#12511;&#12517;&#12540;&#12488;&#12501;&#12521;&#12464;&#12434;&#12469;&#12509;&#12540;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="600.9009"
                  x="1100" y="333.7061">- &#12463;&#12521;&#12473;&#12497;&#12473;&#19978;&#12398;&#12522;&#12477;&#12540;&#12473;&#12363;&#12425;&#38899;&#22768;&#12434;&#35501;&#12415;&#36796;&#12415;&#12289;&#24517;&#35201;&#12395;&#24540;&#12376;&#12390;PCM_SIGNED&#12395;&#12487;&#12467;&#12540;&#12489;&#12375;&#12390;&#20877;&#29983;&#12377;&#12427;&#12290;
