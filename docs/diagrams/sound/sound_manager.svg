            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1100" y="350.9971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.0386"
                  x="1100" y="368.2881">- Manages SE and BGM playback with a single-threaded IO executor.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="499.2813"
                  x="1100" y="385.5791">- Caches Clips for reuse; supports preload, immediate BGM switch, stop, and
                fade-out.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="472.9194"
                  x="1100" y="402.8701">- Volume is handled via FloatControl (linear -&gt; dB conversion); supports mute
                flag.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="494.9966"
                  x="1100" y="420.1611">- Loads audio from classpath resources and decodes to PCM_SIGNED when needed.
            </text>
