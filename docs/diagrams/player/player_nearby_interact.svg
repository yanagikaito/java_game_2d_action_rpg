            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="754.0889"
                  x="1689" y="251.6393">- findNearbyObjectIndex &#12399; objs[] &#12434;&#36208;&#26619;&#12375;&#12289;&#12503;&#12524;&#12452;&#12516;&#12540;&#12398;&#24403;&#12383;&#12426;&#30697;&#24418;&#12392;&#20132;&#24046;&#12377;&#12427;&#26368;&#21021;&#12398;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12398;&#37197;&#21015;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#12434;&#36820;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="951.2471"
                  x="1689" y="268.9304">- getNearbyEntity &#12399;&#12414;&#12378; monsters[] &#12434;&#12481;&#12455;&#12483;&#12463;&#12375;&#27425;&#12395;
                objs[] &#12434;&#12481;&#12455;&#12483;&#12463;&#12375;&#12390;&#12289;&#29983;&#23384;&#12375;&#12390;&#12356;&#12427;&#26368;&#21021;&#12395;&#20132;&#24046;&#12377;&#12427;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#12434;&#36820;&#12377;&#65288;&#25342;&#12360;&#12394;&#12356;&#12491;&#12527;&#12488;&#12522;&#12399;&#38500;&#22806;&#12377;&#12427;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1369.126"
                  x="1689" y="286.2214">- handleInteractInput &#12399;&#36817;&#25509;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#65288;&#12514;&#12531;&#12473;&#12479;&#12540;&#12399;
                999+index &#12391;&#31526;&#21495;&#21270;&#65289;&#12434;&#35299;&#37320;&#12375;&#12289;Enter &#20837;&#21147;&#12434;&#24517;&#35201;&#26465;&#20214;&#12392;&#12375;&#12390;&#12289;&#23453;&#31665;&#12398;&#25805;&#20316;&#12289;&#29190;&#24382;&#65295;&#22778;&#65295;&#23721;&#12398;&#25342;&#24471;&#12289;&#12491;&#12527;&#12488;&#12522;&#12398;&#24489;&#24112;&#37197;&#32622;&#12289;&#12414;&#12383;&#12399;&#12450;&#12452;&#12486;&#12512;&#12434;&#12452;&#12531;&#12505;&#12531;&#12488;&#12522;&#12395;&#36861;&#21152;&#12377;&#12427;&#20966;&#29702;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1689" y="303.5124">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="685.3184"
                  x="1689" y="320.8034">- findNearbyObjectIndex scans objs[] and returns the first index whose collision
                box intersects the player's collision box.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="703.0347"
                  x="1689" y="338.0944">- getNearbyEntity checks monsters[] then objs[] and returns the first
                intersecting living entity (skips non-pickable chickens).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1304.7036"
                  x="1689" y="355.3854">- handleInteractInput interprets the nearby index (monster indices encoded as
                999+index), requires Enter input, and handles chest interaction, picking up bombs/pots/rocks,
                reviving/placing chickens, or adding items to inventory.
            </text>
