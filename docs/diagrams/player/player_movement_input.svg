            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="971.4834"
                  x="1395.5" y="317.333">- processInput &#12399;&#26041;&#21521;&#12461;&#12540;&#12398;&#20837;&#21147;&#12434;&#35501;&#12415;&#21462;&#12426;&#12289;&#21521;&#12365;&#12392;
                moving &#12501;&#12521;&#12464;&#12434;&#35373;&#23450;&#12377;&#12427;&#12290;&#31227;&#21205;&#12461;&#12540;&#12364;&#25276;&#12373;&#12428;&#12390;&#12356;&#12394;&#12356;&#22580;&#21512;&#12399;&#24038;&#20596;&#12460;&#12540;&#12489;&#65288;left-blocking&#65289;&#12434;&#38283;&#22987;&#12377;&#12427;&#12371;&#12392;&#12364;&#12354;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1449.6333"
                  x="1395.5" y="334.624">- updateMovement &#12399;&#31227;&#21205;&#12434;&#35079;&#25968;&#12473;&#12486;&#12483;&#12503;&#12395;&#20998;&#21106;&#12375;&#12390;&#20966;&#29702;&#12375;&#12289;&#12479;&#12452;&#12523;&#65295;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#12398;&#34909;&#31361;&#21028;&#23450;&#12434;&#34892;&#12356;&#12289;&#25276;&#12375;&#20986;&#12375;&#65288;push&#65289;&#12539;&#12473;&#12490;&#12483;&#12503;&#65288;snap&#65289;&#12539;&#12450;&#12531;&#12473;&#12488;&#12483;&#12463;&#65288;unstuck&#65289;&#12392;&#12356;&#12387;&#12383;&#23550;&#20966;&#12434;&#35430;&#12415;&#12289;NPC&#65295;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#65295;&#12514;&#12531;&#12473;&#12479;&#12540;&#12392;&#12398;&#30456;&#20114;&#20316;&#29992;&#12434;&#25201;&#12356;&#12289;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.9409"
                  x="1395.5" y="351.915">- &#34909;&#31361;&#12364;&#12394;&#12369;&#12428;&#12400;&#26368;&#32066;&#30340;&#12395;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12434;&#26356;&#26032;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1395.5" y="369.2061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="672.3311"
                  x="1395.5" y="386.4971">- processInput reads directional keys and sets direction + moving flag; if no
                movement keys, it may start left-blocking.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1249.3584"
                  x="1395.5" y="403.7881">- updateMovement splits movement into steps, runs tile/entity collision
                checks, attempts push/snap/unstuck strategies, handles NPC/OBJ/Monster interactions, and applies final
                world position updates when no collision.
            </text>
