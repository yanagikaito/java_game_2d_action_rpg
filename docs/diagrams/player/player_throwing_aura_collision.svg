            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="1571" y="263.542">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1872.7998"
                  x="1571" y="280.833">- throwHeldX &#12513;&#12477;&#12483;&#12489;&#12399;&#12479;&#12452;&#12523;&#36317;&#38626;&#12392;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12398;&#37325;&#21147;&#12363;&#12425;&#22522;&#28310;&#12392;&#12394;&#12427;&#27700;&#24179;&#36895;&#24230;&#12434;&#31639;&#20986;&#12375;&#12289;vx/vy
                &#12392;&#22402;&#30452;&#12497;&#12521;&#12513;&#12540;&#12479;&#12434;&#35373;&#23450;&#12375;&#12390;&#36895;&#24230;&#12434;&#21046;&#38480;&#12375;&#12289;&#25237;&#25842;&#23550;&#35937;&#12434;&#21021;&#26399;&#21270;&#65288;&#20301;&#32622;&#12289;z&#12289;&#24433;&#12289;&#12501;&#12521;&#12464;&#12289;&#12521;&#12452;&#12501;&#65289;&#12375;&#12390;&#12527;&#12540;&#12523;&#12489;&#12395;&#25147;&#12375;&#12289;&#25152;&#25345;&#21442;&#29031;&#12434;&#12463;&#12522;&#12450;&#12375;&#12289;&#29366;&#24907;&#12434;
                THROW &#12395;&#35373;&#23450;&#12375;&#12289;pickupCooldown &#12434;&#12475;&#12483;&#12488;&#12375;&#12390;&#25237;&#12370;&#20837;&#21147;&#12434;&#28040;&#36027;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="543.9053"
                  x="1571" y="298.124">- updateAura &#12399;&#12458;&#12540;&#12521;&#12434;&#12503;&#12524;&#12452;&#12516;&#12540;&#12395;&#36861;&#24467;&#12373;&#12379;&#12289;deltaMs
                &#12395;&#24540;&#12376;&#12390;&#12450;&#12491;&#12513;&#12540;&#12471;&#12519;&#12531;&#12434;&#36914;&#12417;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1133.9517"
                  x="1571" y="315.415">- resolvePenetration &#12399;&#12514;&#12531;&#12473;&#12479;&#12540;&#32676;&#12434;&#36208;&#26619;&#12375;&#12390;&#12503;&#12524;&#12452;&#12516;&#12540;&#12392;&#12398;&#12496;&#12454;&#12531;&#12487;&#12451;&#12531;&#12464;&#12508;&#12483;&#12463;&#12473;&#12398;&#37325;&#12394;&#12426;&#12434;&#26908;&#20986;&#12375;&#12289;&#20132;&#24046;&#38936;&#22495;&#12434;&#35336;&#31639;&#12375;&#12390;&#37325;&#12394;&#12426;&#12398;&#23567;&#12373;&#12356;&#36600;&#12395;&#27839;&#12387;&#12390;&#12503;&#12524;&#12452;&#12516;&#12540;&#12434;&#25276;&#12375;&#20986;&#12375;&#36011;&#36890;&#12434;&#35299;&#28040;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1571" y="332.7061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1837.5132"
                  x="1571" y="349.9971">- throwHeldX methods compute a base horizontal speed from tile distance and
                object gravity, set vx/vy and vertical parameters, clamp speeds, initialize the thrown entity (position,
                z, shadow, flags, life), add it back to the world, clear held reference, set state to THROW, set
                pickupCooldown, and consume the throw input.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="537.6719"
                  x="1571" y="367.2881">- updateAura keeps the aura positioned on the player and advances its animation
                by deltaMs.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1093.3203"
                  x="1571" y="384.5791">- resolvePenetration iterates monsters, detects bounding-box overlap with the
                player, computes the intersection, and shifts the player out along the smaller overlap axis to resolve
                penetration.
            </text>
