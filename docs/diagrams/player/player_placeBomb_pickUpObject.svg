            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1312.3589"
                  x="1656" y="412.7104">- pickUpObject &#12399; Enter/Throw &#20837;&#21147;&#12434;&#20966;&#29702;&#12377;&#12427;&#65306;&#23453;&#31665;&#12398;&#25805;&#20316;&#12289;&#29190;&#24382;&#65295;&#22778;&#65295;&#23721;&#12398;&#25342;&#24471;&#65288;&#12527;&#12540;&#12523;&#12489;&#12363;&#12425;&#21066;&#38500;&#12375;&#12390;
