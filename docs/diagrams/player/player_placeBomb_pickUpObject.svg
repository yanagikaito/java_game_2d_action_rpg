                ObjBomb &#12434;&#37197;&#32622;&#12375;&#12289;&#12527;&#12540;&#12523;&#12489;&#12395;&#36861;&#21152;&#12375;&#12390;&#21177;&#26524;&#38899;&#12434;&#20877;&#29983;&#12377;&#12427;&#12290;
