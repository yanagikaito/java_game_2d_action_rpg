            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1656" y="430.0014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="895.356"
                  x="1656" y="447.2924">- placeBomb checks input, cooldown, mana and places an ObjBomb aligned to the
                tile grid if the target tile is free; then adds it to the world and plays sound.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1362.7212"
                  x="1656" y="464.5834">- pickUpObject handles Enter/Throw input: chest interaction, picking up
                bombs/pots/rocks (removes from world and stores in heldX), picking up chickens from monster array, and
                item pickup with guards to avoid treating chickens as items.
            </text>
