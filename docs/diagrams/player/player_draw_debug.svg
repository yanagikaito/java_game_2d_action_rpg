            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.73"
                  x="1015" y="188.833">- draw &#12399;&#12503;&#12524;&#12452;&#12516;&#12540;&#12392;&#12458;&#12540;&#12521;&#12434;&#30011;&#38754;&#24231;&#27161;&#12395;&#22793;&#25563;&#12375;&#12390;&#25551;&#30011;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.9409"
                  x="1015" y="206.124">- &#28961;&#25973;&#12420;&#36879;&#26126;&#29366;&#24907;&#12391;&#12399;&#21512;&#25104;&#12514;&#12540;&#12489;&#12434;&#22793;&#26356;&#12375;&#12390;&#21322;&#36879;&#26126;&#12391;&#25551;&#30011;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="624.749"
                  x="1015" y="223.415">- &#12487;&#12496;&#12483;&#12464;&#34920;&#31034;&#12364;&#26377;&#21177;&#12394;&#22580;&#21512;&#12399;
                solidArea&#12289;&#31227;&#21205;&#20808;&#30697;&#24418;&#12289;&#21608;&#36794;&#12479;&#12452;&#12523;&#12434;&#25551;&#30011;&#12375;&#12289;&#34909;&#31361;&#12479;&#12452;&#12523;&#12399;&#24375;&#35519;&#34920;&#31034;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="553.2236"
                  x="1015" y="240.7061">- &#12458;&#12540;&#12521;&#12399;&#12503;&#12524;&#12452;&#12516;&#12540;&#12398;
                HP &#12364;&#28288;&#12479;&#12531;&#12398;&#12392;&#12365;&#12395;&#12450;&#12463;&#12486;&#12451;&#12502;&#21270;&#12373;&#12428;&#12289;&#25313;&#22823;&#12539;&#21322;&#36879;&#26126;&#12391;&#25551;&#30011;&#12373;&#12428;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1015" y="257.9971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1183.5649"
                  x="1015" y="275.2881">- interactNPC: When the Enter key is pressed, start a conversation if an NPC is
                present; if no NPC is nearby, fire the sword when the aura is active and a sword is equipped, otherwise
                initiate a melee attack.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1185.3677"
                  x="1015" y="292.5791">- contactMonster: On colliding with a monster, compute a knockback vector, apply
                invincibility and damage handling, show damage feedback, and perform a game&#8209;over check if the
                player's life reaches zero.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1210.4346"
                  x="1015" y="309.8701">- damageMonster: Apply damage to the specified monster; on death, handle drops,
                award experience, check for level&#8209;up, play defeat effects, and schedule respawn. Chickens use a
                specialized damage handler.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1466.7974"
                  x="1015" y="327.1611">- damageInteractiveTile: While attacking, damage destructible interactive tiles
                when the correct item is used; play sound and particle effects, decrement tile life, set temporary
                invincibility, and replace the tile with its destroyed form when its life reaches zero.
            </text>
        </g><!--link Player to GameWindow-->
