                  x="1315.5" y="248.415">- moving &#12392; collision &#12434;&#12522;&#12475;&#12483;&#12488;&#12375;&#12289;&#34909;&#31361;&#21028;&#23450;&#12434;&#23455;&#34892;&#12377;&#12427;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="815.3882"
                  x="1315.5" y="265.7061">- &#31227;&#21205;&#12501;&#12521;&#12464;&#12392;&#34909;&#31361;&#12501;&#12521;&#12464;&#12434;&#12463;&#12522;&#12450;&#12375;&#12289;&#12479;&#12452;&#12523;&#12289;NPC&#12289;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12289;&#12514;&#12531;&#12473;&#12479;&#12540;&#12289;&#12452;&#12531;&#12479;&#12521;&#12463;&#12486;&#12451;&#12502;&#12479;&#12452;&#12523;&#12395;&#23550;&#12375;&#12390;&#34909;&#31361;&#21028;&#23450;&#12434;&#23455;&#34892;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.9409"
                  x="1315.5" y="282.9971">- &#36817;&#25509;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12434;&#26908;&#20986;&#12377;&#12427;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="715.8379"
                  x="1315.5" y="300.2881">- &#36817;&#25509;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12398;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#12434;&#35211;&#12388;&#12369;&#12289;&#36817;&#25509;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#21442;&#29031;&#12434;&#35299;&#27770;&#12377;&#12427;&#65288;findNearbyObjectIndex
                / getNearbyEntity)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.9409"
                  x="1315.5" y="317.5791">- &#30636;&#38291;&#30340;&#12394;&#25237;&#12370;&#65295;&#25342;&#12356;&#12461;&#12540;&#12434;&#20966;&#29702;&#12377;&#12427;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="560.4663"
                  x="1315.5" y="334.8701">- &#25237;&#12370;&#65295;&#25342;&#12356;&#12461;&#12540;&#12398;&#30636;&#38291;&#25276;&#19979;&#26178;&#12395;&#12289;&#25152;&#25345;&#29366;&#24907;&#12395;&#24540;&#12376;&#12390;
                startPickup &#12434;&#21628;&#12406;&#12363;&#25237;&#12370;&#20966;&#29702;&#12434;&#23455;&#34892;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.6836"
                  x="1315.5" y="352.1611">- invincibility &#12398;&#26356;&#26032;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1315.5" y="369.4521">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.7979"
                  x="1315.5" y="386.7432">- Update pickupCooldown and aura
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.4204"
                  x="1315.5" y="404.0342">- Decrement pickupCooldown and update the aura state/timer.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4287"
                  x="1315.5" y="421.3252">- Reset moving and collision, then run collision checks
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="742.041"
                  x="1315.5" y="438.6162">- Clear the movement flag and collision flag, then perform collision checks
                for tiles, NPCs, objects, monsters, and interactive tiles.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.6753"
                  x="1315.5" y="455.9072">- Detect nearby objects
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="619.271"
                  x="1315.5" y="473.1982">- Find nearby object index and resolve a nearby entity reference
                (findNearbyObjectIndex / getNearbyEntity).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4834"
                  x="1315.5" y="490.4893">- Handle instant throw/pickup key
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="656.8237"
                  x="1315.5" y="507.7803">- On the momentary throw/pickup key press, invoke startPickup or perform throw
                logic depending on holding state.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2495"
                  x="1315.5" y="525.0713">- changeMap and update aura world position / mapId
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="576.6528"
                  x="1315.5" y="542.3623">- Call changeMap with the current tile ID and update the aura&#8217;s world
                coordinates and map identifier.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.918"
                  x="1315.5" y="559.6533">- Knockback priority handling
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="735.9346"
                  x="1315.5" y="576.9443">- If knockbackTimer &gt; 0, apply per-frame displacement, decrement the timer,
                and call resolvePenetration when knockback ends.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.9434"
                  x="1315.5" y="594.2354">- Update invincibility and cooldowns
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.5322"
                  x="1315.5" y="611.5264">- Advance invincibility counters and decrement bomb/fire cooldowns.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2178"
                  x="1315.5" y="628.8174">- If attacking or guarding, run attack/guard routines
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="489.2139"
                  x="1315.5" y="646.1084">- Call startAttack/startGuard and execute the corresponding attack or guard
                handling.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5952"
                  x="1315.5" y="663.3994">- Process input and interaction
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="604.1699"
                  x="1315.5" y="680.6904">- Run general input processing and handle interaction/enter input
                (processInput and handleInteractInput).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9307"
                  x="1315.5" y="697.9814">- PICKUP / HOLD_WALK state handling
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="703.8281"
                  x="1315.5" y="715.2725">- Advance pickup animation frames or keep held entities (bomb, pot, rock,
                chicken) positioned above the player while held.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1086.0967"
                  x="1315.5" y="732.5635">- If moving, update movement, collision, animation, and tile movement &#8212;
                Execute updateMovement, updateCollision, updateAnimation, and updateTileMovement when the moving flag is
                set.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3989"
                  x="1315.5" y="749.8545">- Update invincibility state
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.5723"
                  x="1315.5" y="767.1455">- Finalize invincibility-related updates (timers, transparency, and flag
                resets).
            </text>
        </g>
