            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="366.5" y="69.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="551.8208"
                  x="366.5" y="86.333">- `lightUpdated` &#12501;&#12521;&#12464;&#12434;&#36861;&#21152;&#12375;&#12289;&#36984;&#25246;&#12450;&#12452;&#12486;&#12512;&#12391;&#12521;&#12531;&#12479;&#12531;&#12398;&#35013;&#20633;/&#35299;&#38500;&#12364;&#34892;&#12431;&#12428;&#12383;&#12371;&#12392;&#12434;&#31034;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.709"
                  x="366.5" y="103.624">- `currentLight` &#12395;&#36984;&#25246;&#20013;&#12398;&#20809;&#28304;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#12434;&#20445;&#25345;&#65288;null
                &#12391;&#26410;&#35013;&#20633;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="572.8125"
                  x="366.5" y="120.915">- &#36984;&#25246;&#20966;&#29702;: &#36984;&#25246;&#12450;&#12452;&#12486;&#12512;&#12364;
                `LanternType` &#12398;&#22580;&#21512;&#12289;&#26082;&#12395;&#35013;&#20633;&#20013;&#12394;&#12425;&#35299;&#38500;&#65288;setCurrentLight(null)&#65289;&#12289;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="539.2778"
                  x="366.5" y="138.2061">- &#26410;&#35013;&#20633;&#12394;&#12425;&#35013;&#20633;&#65288;setCurrentLight(selectedItem)&#65289;&#12290;&#20966;&#29702;&#24460;&#12395;
                `lightUpdated = true` &#12434;&#35373;&#23450;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="366.5" y="155.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="523.9609"
                  x="366.5" y="172.7881">- Added `lightUpdated` flag to indicate that the selected item toggled lantern
                equip/unequip.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="494.9839"
                  x="366.5" y="190.0791">- `currentLight` holds the currently selected light-source entity (null when
                unequipped).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="650.3364"
                  x="366.5" y="207.3701">- Selection logic: if the selected item is a `LanternType`, unequip when
                already equipped (`setCurrentLight(null)`),
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.833"
                  x="366.5" y="224.6611">- otherwise equip (`setCurrentLight(selectedItem)`); after handling, set
                `lightUpdated = true`.
            </text>
        </g><!--link Player to Entity-->
