                  x="2131.5" y="297.5314">- CollisionChecker &#12398;&#32080;&#26524;&#12392; GameWindow &#12398;&#12469;&#12540;&#12499;&#12473;&#65288;UI&#12289;TileManager&#12289;&#12466;&#12540;&#12512;&#29366;&#24907;&#12398;&#22793;&#26356;&#65289;&#12434;&#21033;&#29992;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="2131.5" y="314.8224">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="572.9585"
                  x="2131.5" y="332.1134">- updateCollision checks tile collision and entity collisions (NPC, objects,
                monsters, interactive tiles).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1148.1958"
                  x="2131.5" y="349.4044">- It triggers interactions: start dialogue with merchant/save NPCs, pick up
                objects, handle monster contact (damage or pickup), damage interactive tiles, and request map changes
                based on current tile.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="538.9795"
                  x="2131.5" y="366.6954">- Uses CollisionChecker results and GameWindow services (UI, TileManager,
                state changes).
