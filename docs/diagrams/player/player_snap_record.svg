            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.0303"
                  x="1256" y="331.4971">- recordSafePosition saves current world coords and solid-area size when not
                colliding.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1263.7993"
                  x="1256" y="348.7881">- snapToTileEdge computes penetration to nearest tile edge, tries simple
                correction, then fallback micro-adjustments (push/snap/unstuck style candidates), and applies the first
                valid offset that clears tile/itile/npc collisions.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.2114"
                  x="1256" y="366.0791">- Uses CollisionChecker.checkTile and checkEntity with pixel offsets.
            </text>
