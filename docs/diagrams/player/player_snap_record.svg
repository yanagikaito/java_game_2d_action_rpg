            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1360.8042"
                  x="1256" y="279.624">- snapToTileEdge &#12399;&#26368;&#23492;&#12426;&#12398;&#12479;&#12452;&#12523;&#22659;&#30028;&#12408;&#12398;&#20405;&#20837;&#37327;&#12434;&#35336;&#31639;&#12375;&#12289;&#21336;&#32020;&#35036;&#27491;&#12434;&#35430;&#12375;&#12383;&#24460;&#12289;&#12501;&#12457;&#12540;&#12523;&#12496;&#12483;&#12463;&#12398;&#24494;&#35519;&#25972;&#20505;&#35036;&#65288;push/snap/unstuck
