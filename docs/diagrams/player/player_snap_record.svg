            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="540.3062"
                  x="1256" y="296.915">- CollisionChecker.checkTile &#12392; checkEntity &#12434;&#12500;&#12463;&#12475;&#12523;&#21336;&#20301;&#12398;&#12458;&#12501;&#12475;&#12483;&#12488;&#12391;&#21628;&#12403;&#20986;&#12375;&#12390;&#12356;&#12427;&#12290;
            </text>
