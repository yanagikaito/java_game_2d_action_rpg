            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="752.5972"
                  x="1580" y="406.1693">- interactNPC: Enter &#12461;&#12540;&#12391; NPC &#12364;&#12356;&#12428;&#12400;&#20250;&#35441;&#12434;&#38283;&#22987;&#12289;&#12356;&#12394;&#12369;&#12428;&#12400;&#12458;&#12540;&#12521;&#65291;&#21091;&#35013;&#20633;&#12391;&#23556;&#20986;&#12289;&#12381;&#12358;&#12391;&#12394;&#12369;&#12428;&#12400;&#36817;&#25509;&#25915;&#25731;&#12434;&#38283;&#22987;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="728.0381"
                  x="1580" y="423.4604">- contactMonster: &#12514;&#12531;&#12473;&#12479;&#12540;&#25509;&#35302;&#26178;&#12395;&#12494;&#12483;&#12463;&#12496;&#12483;&#12463;&#12505;&#12463;&#12488;&#12523;&#12434;&#35336;&#31639;&#12375;&#28961;&#25973;&#29366;&#24907;&#12420;&#12480;&#12513;&#12540;&#12472;&#20966;&#29702;&#12289;&#12466;&#12540;&#12512;&#12458;&#12540;&#12496;&#12540;&#21028;&#23450;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="876.1035"
                  x="1580" y="440.7514">- damageMonster: &#25351;&#23450;&#12514;&#12531;&#12473;&#12479;&#12540;&#12395;&#12480;&#12513;&#12540;&#12472;&#12434;&#19982;&#12360;&#12289;&#27515;&#20129;&#26178;&#12399;&#12489;&#12525;&#12483;&#12503;&#12539;&#32076;&#39443;&#20516;&#12539;&#12524;&#12505;&#12523;&#21028;&#23450;&#12539;&#12522;&#12473;&#12509;&#12540;&#12531;&#20966;&#29702;&#12434;&#34892;&#12358;&#12290;&#12491;&#12527;&#12488;&#12522;&#12399;&#23554;&#29992;&#20966;&#29702;&#12434;&#21628;&#12406;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="741.0635"
                  x="1580" y="458.0424">- damageInteractiveTile: &#25915;&#25731;&#20013;&#12395;&#27491;&#12375;&#12356;&#12450;&#12452;&#12486;&#12512;&#12391;&#30772;&#22730;&#21487;&#33021;&#12394;&#12452;&#12531;&#12479;&#12521;&#12463;&#12486;&#12451;&#12502;&#12479;&#12452;&#12523;&#12408;&#12480;&#12513;&#12540;&#12472;&#12434;&#19982;&#12360;&#12289;&#30772;&#22730;&#26178;&#12395;&#32622;&#25563;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1580" y="475.3334">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1072.3032"
                  x="1580" y="492.6244">- interactNPC: When the Enter key is pressed, start a conversation if an NPC is
                present; if not, fire the sword when aura is active and a sword is equipped, otherwise begin a melee
                attack.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1037.9307"
                  x="1580" y="509.9154">- contactMonster: On collision with a monster, compute a knockback vector, apply
                invincibility and damage handling, and perform a game-over check if the player's life reaches zero.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1202.4873"
                  x="1580" y="527.2064">- damageMonster: Apply damage to the specified monster; on death, handle drops,
                grant experience, check for level-up, play defeat effects, and schedule respawn. Chickens use a
                specialized damage handler.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1411.1602"
                  x="1580" y="544.4975">- damageInteractiveTile: While attacking, damage destructible interactive tiles
                when the correct item is used; play sound and particles, decrement life, set temporary invincibility,
                and replace the tile with its destroyed form when its life reaches zero.
            </text>
        </g><!--reverse link Entity to Npc-->
