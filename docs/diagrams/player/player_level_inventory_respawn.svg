            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="847.5" y="348.542">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="844.3145"
                  x="847.5" y="365.833">- getTimer: &#25351;&#23450;&#12514;&#12531;&#12473;&#12479;&#12540;&#12398;&#12522;&#12473;&#12509;&#12540;&#12531;&#29992;&#12395;&#19968;&#22238;&#23455;&#34892;&#12398;
                Timer &#12434;&#29983;&#25104;&#12375;&#12289;&#26178;&#38291;&#32076;&#36942;&#12391; AssetSetter
                &#12395;&#12424;&#12427;&#20877;&#37197;&#32622;&#12392;&#12522;&#12473;&#12509;&#12540;&#12531;&#12501;&#12521;&#12464;&#35299;&#38500;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="738.8799"
                  x="847.5" y="383.124">- checkLevelUp: &#32076;&#39443;&#20516;&#12364;&#38334;&#20516;&#12434;&#36229;&#12360;&#12383;&#12425;&#12524;&#12505;&#12523;&#12434;&#19978;&#12370;&#12289;&#12473;&#12486;&#12540;&#12479;&#12473;&#12434;&#24375;&#21270;&#12375;&#12480;&#12452;&#12450;&#12525;&#12464;&#34920;&#31034;&#12539;HP&#20840;&#22238;&#24489;&#12539;&#12458;&#12540;&#12521;&#30330;&#21205;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="585.019"
                  x="847.5" y="400.415">- selectItem: &#36984;&#25246;&#20013;&#12398;&#12452;&#12531;&#12505;&#12531;&#12488;&#12522;&#12450;&#12452;&#12486;&#12512;&#12434;&#21462;&#24471;&#12375;&#12289;&#27494;&#22120;/&#30462;&#12398;&#35013;&#20633;&#26356;&#26032;&#12420;&#12509;&#12540;&#12471;&#12519;&#12531;&#20351;&#29992;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="860.3232"
                  x="847.5" y="417.7061">- isEquipped / searchItemInInventory / canObtainItem: &#35013;&#20633;&#21028;&#23450;&#12289;&#12452;&#12531;&#12505;&#12531;&#12488;&#12522;&#20869;&#26908;&#32034;&#12289;&#21462;&#24471;&#21487;&#33021;&#21028;&#23450;&#65288;&#12473;&#12479;&#12483;&#12463;&#20966;&#29702;&#12392;&#31354;&#12365;&#12473;&#12525;&#12483;&#12488;&#30906;&#35469;&#65289;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="847.5" y="434.9971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1025.2544"
                  x="847.5" y="452.2881">- getTimer: Creates a one&#8209;shot javax.swing.Timer for monster respawn;
                after the delay it calls AssetSetter.setMonster(), clears the monster&#8217;s respawning flag, and stops
                the timer.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1692.3423"
                  x="847.5" y="469.5791">- checkLevelUp: When current EXP meets or exceeds the next&#8209;level
                threshold, increments the player level, updates the next level EXP, increases max HP and core stats,
                recalculates attack/defense, plays the level&#8209;up sound, opens a dialogue message, fully restores
                HP, and activates the aura.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1452.4834"
                  x="847.5" y="486.8701">- selectItem: Retrieves the item selected in the inventory UI slot; equips
                weapons/axes (updates current weapon, attack, and attack sprites), equips shields (updates current
                shield and defense), and invokes potion use handlers for red/green/blue potions.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="2183.689"
                  x="847.5" y="504.1611">- isEquipped / searchItemInInventory / canObtainItem: isEquipped checks if an
                item is currently equipped as weapon or shield; searchItemInInventory finds an item index by name;
                canObtainItem determines if an item can be picked up (handles stackable items by incrementing amount or
                placing in a free slot, and rejects items like bombs), returning whether acquisition succeeded.
            </text>
        </g><!--reverse link Entity to Weapon-->
