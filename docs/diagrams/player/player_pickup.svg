                  x="730.51" y="357.5791">- If checks pass, pendingPickupEntity is set and state -&gt; PICKUP.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="712.7847"
                  x="730.51" y="374.8701">- finishPickup() finalizes: removes entity from arrays, calls onPickedUp, sets
                heldX, sets holding=true, sets pickupCooldown.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.9033"
                  x="730.51" y="392.1611">- fallbackToHoldWalk() resets state/sprite when pickup fails.
            </text>
