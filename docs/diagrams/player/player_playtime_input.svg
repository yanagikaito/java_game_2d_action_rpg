            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="1164.23" y="253.3283">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="810.4751"
                  x="1164.23" y="270.6193">- updatePlayTime: &#12501;&#12524;&#12540;&#12512;&#12372;&#12392;&#12398;&#32076;&#36942;&#31186;&#12434;&#33988;&#31309;&#12375;&#12390;&#31186;&#21336;&#20301;&#12391;
                playTimeSeconds &#12434;&#22679;&#12420;&#12377;&#12290;&#19978;&#38480;(MAX_PLAY_SECONDS)&#12391;&#12459;&#12531;&#12473;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="622.6035"
                  x="1164.23" y="287.9104">- isThrowKeyJustPressed: &#25237;&#25842;&#12461;&#12540;&#12398;&#12300;&#25276;&#19979;&#38283;&#22987;&#12301;&#12434;&#26908;&#20986;&#12377;&#12427;&#12518;&#12540;&#12486;&#12451;&#12522;&#12486;&#12451;&#65288;&#21069;&#12501;&#12524;&#12540;&#12512;&#29366;&#24907;&#12434;&#20445;&#25345;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="587.9897"
                  x="1164.23" y="305.2014">- isBlockingLeft / hasLeftShield: &#24038;&#20596;&#12502;&#12525;&#12483;&#12463;&#29366;&#24907;&#12392;&#24038;&#25163;&#12395;&#30462;&#12434;&#35013;&#20633;&#12375;&#12390;&#12356;&#12427;&#12363;&#12434;&#36820;&#12377;&#31777;&#26131;&#12466;&#12483;&#12479;&#12540;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1164.23" y="322.4924">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1131.8823"
                  x="1164.23" y="339.7834">- updatePlayTime: Accumulate the frame's elapsed seconds and increment
                playTimeSeconds once per accumulated second; stop increasing when MAX_PLAY_SECONDS is reached (cap at
                max).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1020.8999"
                  x="1164.23" y="357.0744">- isThrowKeyJustPressed: Utility that detects the throw key's rising edge by
                comparing the current key state with the previous frame's state and updates the stored previous state.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="530.3657"
                  x="1164.23" y="374.3654">- isBlockingLeft: Simple getter that returns whether the player is currently
                blocking to the left.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="805.7334"
                  x="1164.23" y="391.6564">- hasLeftShield: Simple getter that returns whether the player has a shield
                equipped in the left hand (checks getCurrentShield() and its type).
            </text>
        </g><!--reverse link Obj to ObjBomb-->
