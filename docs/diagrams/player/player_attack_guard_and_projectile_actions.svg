            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1283.4326"
                  x="773" y="449.333">- playerAttacking &#12399;&#25915;&#25731;&#12450;&#12491;&#12513;&#12540;&#12471;&#12519;&#12531;&#12434;&#36914;&#12417;&#12289;&#24403;&#12383;&#12426;&#21028;&#23450;&#12434;&#19968;&#26178;&#30340;&#12395;&#25313;&#24373;&#65295;&#31227;&#21205;&#12375;&#12390;&#25915;&#25731;&#38936;&#22495;&#12434;&#20316;&#12426;&#12289;&#12514;&#12531;&#12473;&#12479;&#12540;&#12420;&#12452;&#12531;&#12479;&#12521;&#12463;&#12486;&#12451;&#12502;&#12479;&#12452;&#12523;&#12434;&#12481;&#12455;&#12483;&#12463;&#12375;&#12390;&#12480;&#12513;&#12540;&#12472;&#12434;&#19982;&#12360;&#12289;&#32066;&#20102;&#24460;&#12395;&#20803;&#12398;&#20301;&#32622;&#12392;&#24403;&#12383;&#12426;&#21028;&#23450;&#12434;&#24489;&#20803;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="594.439"
                  x="773" y="466.624">- playerGuarding &#12399;&#12460;&#12540;&#12489;&#12450;&#12491;&#12513;&#12540;&#12471;&#12519;&#12531;&#12434;&#36914;&#12417;&#12289;&#12460;&#12540;&#12489;&#12501;&#12524;&#12540;&#12512;&#12364;&#32066;&#12431;&#12387;&#12383;&#12425;&#29366;&#24907;&#12434;&#12522;&#12475;&#12483;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="860.9707"
                  x="773" y="483.915">- shootSword &#12399; ObjSwordProjectile &#12434;&#29983;&#25104;&#12375;&#12390;&#21021;&#26399;&#21270;&#12375;&#12289;&#12466;&#12540;&#12512;&#12398;&#12503;&#12525;&#12472;&#12455;&#12463;&#12479;&#12452;&#12523;&#12522;&#12473;&#12488;&#12395;&#36861;&#21152;&#12375;&#12289;&#21177;&#26524;&#38899;&#12434;&#20877;&#29983;&#12375;&#12390;&#12463;&#12540;&#12523;&#12480;&#12454;&#12531;&#12434;&#38283;&#22987;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="941.1353"
                  x="773" y="501.2061">- playerAttackingFireball &#12399;&#20837;&#21147;&#12539;&#12463;&#12540;&#12523;&#12480;&#12454;&#12531;&#12539;&#12510;&#12490;&#12434;&#30906;&#35469;&#12375;&#12289;&#26465;&#20214;&#12434;&#28288;&#12383;&#12379;&#12400;
                ObjFireball &#12434;&#29983;&#25104;&#12375;&#12390;&#12522;&#12473;&#12488;&#12395;&#36861;&#21152;&#12375;&#12289;&#21177;&#26524;&#38899;&#12434;&#20877;&#29983;&#12375;&#12390;&#12459;&#12454;&#12531;&#12479;&#12434;&#26356;&#26032;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="773" y="518.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1191.5693"
                  x="773" y="535.7881">- playerAttacking advances attack animation, temporarily expands/moves the
                collision area to the attack region, checks monsters/interactive tiles and applies damage, then restores
                original position/solid area.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="518.8384"
                  x="773" y="553.0791">- playerGuarding advances guard animation and resets state after guard frames
                complete.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="736.6138"
                  x="773" y="570.3701">- shootSword creates an ObjSwordProjectile, initializes it, adds it to the game's
                projectile list, plays sound, and starts cooldowns.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="799.9253"
                  x="773" y="587.6611">- playerAttackingFireball checks input, cooldown, mana, then creates ObjFireball,
                adds to projectile list, plays sound, and updates counters.
            </text>
        </g><!--reverse link Projectile to ObjSwordProjectile-->
