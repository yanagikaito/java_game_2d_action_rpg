        <g class="entity" id="ent0026">
            <path d="M1017.5,292.0137 L1017.5,379.5137 L982.59,383.5137 L1017.5,387.5137 L1017.5,474.9238 A0,0 0 0 0 1017.5,474.9238 L2484.3755,474.9238 A0,0 0 0 0 2484.3755,474.9238 L2484.3755,302.0137 L2474.3755,292.0137 L1017.5,292.0137 A0,0 0 0 0 1017.5,292.0137"
