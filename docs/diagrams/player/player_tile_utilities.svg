            <path d="M2474.3755,292.0137 L2474.3755,302.0137 L2484.3755,302.0137 L2474.3755,292.0137" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="1023.5" y="311.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="561.2852"
                  x="1023.5" y="328.333">- getTileSolidRect &#12399;&#12479;&#12452;&#12523;&#24231;&#27161;&#12363;&#12425;
                blocking &#12479;&#12452;&#12523;&#12398;&#30697;&#24418;&#12434;&#36820;&#12377;&#65288;blocking
                &#12391;&#12394;&#12369;&#12428;&#12400; null&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.2998"
                  x="1023.5" y="345.624">- canMoveBy &#12399; dx,dy &#12458;&#12501;&#12475;&#12483;&#12488;&#12391;
                tile/itile/npc &#12398;&#34909;&#31361;&#12434;&#12481;&#12455;&#12483;&#12463;&#12377;&#12427;&#12518;&#12540;&#12486;&#12451;&#12522;&#12486;&#12451;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="552.5571"
                  x="1023.5" y="362.915">- resolveTileOverlapWithPush &#12399;&#21608;&#22258;&#12479;&#12452;&#12523;&#12434;&#36208;&#26619;&#12375;&#26368;&#23567;&#25276;&#12375;&#20986;&#12375;&#37327;&#12434;&#35430;&#12375;&#12390;&#20301;&#32622;&#12434;&#35036;&#27491;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.3398"
                  x="1023.5" y="380.2061">- attemptUnstuck &#12399;&#27573;&#38542;&#30340;&#12395;&#23567;&#31227;&#21205;&#8594;&#36600;&#20998;&#38626;&#8594;snap&#8594;BFS&#8594;&#26368;&#24460;&#12395;&#24489;&#24112;&#12398;&#38918;&#12391;&#25375;&#12414;&#12426;&#35299;&#38500;&#12434;&#35430;&#12415;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1023.5" y="397.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="672.7437"
                  x="1023.5" y="414.7881">- getTileSolidRect returns the rectangle for a blocking tile at the given tile
                coordinates, or null if the tile is not blocking.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="671.9438"
                  x="1023.5" y="432.0791">- canMoveBy is a utility that checks whether moving by the pixel offsets dx,
                dy would collide with tiles, itiles, or NPCs.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1445.8755"
                  x="1023.5" y="449.3701">- resolveTileOverlapWithPush scans surrounding tiles, computes intersection
                rectangles, and tries minimal push corrections in this order: X-only, Y-only, then diagonal; each
                candidate is validated with canMoveBy, and the first valid correction is applied.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1275.3584"
                  x="1023.5" y="466.6611">- attemptUnstuck attempts to free the player in stages: small local offsets,
                axis-separated pushes, a snapToTileEdge attempt, a BFS search for the nearest free tile (teleport), and
                finally restoring the last saved safe position.
            </text>
        </g><!--link Player to GameWindow-->
