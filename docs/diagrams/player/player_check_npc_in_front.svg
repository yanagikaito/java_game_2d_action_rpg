            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.9409"
                  x="633.5" y="83.333">- &#12503;&#12524;&#12452;&#12516;&#12540;&#12398;&#21521;&#12365;&#12505;&#12463;&#12488;&#12523;&#12434;&#20316;&#25104;&#12375;&#12289;&#21069;&#26041;&#31684;&#22258;&#12398;&#26908;&#32034;&#30697;&#24418;&#12434;&#27083;&#31689;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="536.6118"
                  x="633.5" y="100.624">- &#21508; NPC &#12398;&#34909;&#31361;&#30697;&#24418;&#12434;&#35413;&#20385;&#12375;&#12289;&#27491;&#38754;&#24230;&#65288;&#21521;&#12365;&#12505;&#12463;&#12488;&#12523;&#12408;&#12398;&#25237;&#24433;&#65289;&#12392;&#36317;&#38626;&#12391;&#26368;&#33391;&#20505;&#35036;&#12434;&#36984;&#12406;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.7827"
                  x="633.5" y="117.915">- &#25147;&#12426;&#20516;&#12399;&#35211;&#12388;&#12363;&#12387;&#12383; NPC
                &#12398;&#37197;&#21015;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#12289;&#26410;&#26908;&#20986;&#26178;&#12399;
                -1&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="633.5" y="135.2061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="672.7437"
                  x="633.5" y="152.4971">- getTileSolidRect returns the rectangle for a blocking tile at the given tile
                coordinates, or null if the tile is not blocking.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="671.9438"
                  x="633.5" y="169.7881">- canMoveBy is a utility that checks whether moving by the pixel offsets dx, dy
                would collide with tiles, itiles, or NPCs.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1445.8755"
                  x="633.5" y="187.0791">- resolveTileOverlapWithPush scans surrounding tiles, computes intersection
                rectangles, and tries minimal push corrections in this order: X-only, Y-only, then diagonal; each
                candidate is validated with canMoveBy, and the first valid correction is applied.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1275.3584"
                  x="633.5" y="204.3701">- attemptUnstuck attempts to free the player in stages: small local offsets,
                axis-separated pushes, a snapToTileEdge attempt, a BFS search for the nearest free tile (teleport), and
                finally restoring the last saved safe position.
            </text>
        </g><!--link Player to GameWindow-->
