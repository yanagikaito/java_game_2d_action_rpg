            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.5239"
                  x="1309.5" y="480.0791">- Initialize a flow field and navigate toward the player using the PathFinder.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="828.1216"
                  x="1309.5" y="497.3701">- Begin attacking when the player is within close range, switching between
                axe-specific sprites and regular attack sprites based on weapon type.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="742.1553"
                  x="1309.5" y="514.6611">- Advance attack animations during attacks, temporarily extend position and
                collision bounds for hit detection, and apply damage.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="630.1001"
                  x="1309.5" y="531.9521">- Load sprites, resize them to the tile size after loading, and replace
                hair-color pixels during image processing.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.2769"
                  x="1309.5" y="549.2432">- Manage state such as invincibility frames and HP bar display.
