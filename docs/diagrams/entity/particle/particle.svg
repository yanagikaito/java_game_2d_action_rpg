            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="544.1021"
                  x="656.5" y="671.9893">- gameWindow: Reference used to convert world coordinates to screen coordinates
                via Player.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.2578"
                  x="656.5" y="689.2803">- generator: The Entity that spawned this particle.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.728"
                  x="656.5" y="706.5713">- color: Rendering color.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8398"
                  x="656.5" y="723.8623">- size: Render size in pixels.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.7471"
                  x="656.5" y="741.1533">- speed: Speed scale.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.707"
                  x="656.5" y="758.4443">- xd, yd: Direction components (integers).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.4795"
                  x="656.5" y="775.7354">- startY: Y coordinate at creation (used for ground/landing check).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4243"
                  x="656.5" y="793.0264">- tileSize: Tile size (obtained from FrameApp).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.4307"
                  x="656.5" y="810.3174">- gravity: Fixed gravity value (default 1.0).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="827.6084">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.8018"
                  x="656.5" y="844.8994">Constructor:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.2451"
                  x="656.5" y="862.1904">- Particle(GameWindow, Entity, Color, size, speed, maxLife, xd, yd)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="583.5908"
                  x="656.5" y="879.4814">- &#29983;&#25104;&#20803;&#65288;generator&#65289;&#12398;&#20301;&#32622;&#12363;&#12425;&#12458;&#12501;&#12475;&#12483;&#12488;&#12434;&#35336;&#31639;&#12375;&#12390;&#12289;&#21021;&#26399;&#12398;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12392;&#12521;&#12452;&#12501;&#12434;&#35373;&#23450;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="896.7725">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.2451"
                  x="656.5" y="914.0635">- Particle(GameWindow, Entity, Color, size, speed, maxLife, xd, yd)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="513.3604"
                  x="656.5" y="931.3545">- Calculates an offset from the generator's position to set initial world
                coordinates and life.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="948.6455">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="656.5" y="965.9365">update():
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.9409"
                  x="656.5" y="983.2275">- &#12521;&#12452;&#12501;&#12434;&#28187;&#23569;&#12373;&#12379;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.8945"
                  x="656.5" y="1000.5186">- &#12521;&#12452;&#12501;&#12364;&#23569;&#12394;&#12367;&#12394;&#12427;&#12392;
                yd &#12395;&#37325;&#21147;&#12434;&#21152;&#31639;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.6563"
                  x="656.5" y="1017.8096">- xd&#65295;yd &#12392; speed &#12434;&#20351;&#12387;&#12390;&#20301;&#32622;&#12434;&#26356;&#26032;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.189"
                  x="656.5" y="1035.1006">- worldY &#12364; startY + tileSize &#12434;&#36229;&#12360;&#12383;&#12425;&#12497;&#12540;&#12486;&#12451;&#12463;&#12523;&#12434;&#38750;&#29983;&#23384;&#12395;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="1052.3916">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8608"
                  x="656.5" y="1069.6826">- Decrements life.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.918"
                  x="656.5" y="1086.9736">- Adds gravity to yd when life is low.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0996"
                  x="656.5" y="1104.2646">- Updates position using xd/yd and speed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.3496"
                  x="656.5" y="1121.5557">- Marks particle dead when worldY exceeds startY + tileSize.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="1138.8467">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.0845"
                  x="656.5" y="1156.1377">draw(Graphics2D):
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.498"
                  x="656.5" y="1173.4287">- gameWindow.getPlayer() &#12434;&#20351;&#12387;&#12390;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12434;&#12473;&#12463;&#12522;&#12540;&#12531;&#24231;&#27161;&#12395;&#22793;&#25563;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.9409"
                  x="656.5" y="1190.7197">- &#25351;&#23450;&#12373;&#12428;&#12383;&#33394;&#12392;&#12469;&#12452;&#12474;&#12391;&#22615;&#12426;&#12388;&#12406;&#12375;&#12383;&#30697;&#24418;&#12434;&#25551;&#30011;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="1208.0107">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="481.2222"
                  x="656.5" y="1225.3018">- Converts world coordinates to screen coordinates using
                gameWindow.getPlayer().
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.8232"
                  x="656.5" y="1242.5928">- Draws a filled rectangle with the specified color and size.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="1259.8838">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.728"
                  x="656.5" y="1277.1748">Dependencies:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.6772"
                  x="656.5" y="1294.4658">- Entity&#65288;&#12473;&#12540;&#12497;&#12540;&#12463;&#12521;&#12473;&#65289;:
                &#20301;&#32622;&#12420;&#12521;&#12452;&#12501;&#31649;&#29702;&#12398;&#12513;&#12477;&#12483;&#12489;&#12434;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="586.4854"
                  x="656.5" y="1311.7568">- GameWindow / Player: &#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12363;&#12425;&#12473;&#12463;&#12522;&#12540;&#12531;&#24231;&#27161;&#12408;&#12398;&#22793;&#25563;&#12392;&#12497;&#12540;&#12486;&#12451;&#12463;&#12523;&#31649;&#29702;&#12434;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.8545"
                  x="656.5" y="1329.0479">- FrameApp: &#12479;&#12452;&#12523;&#12469;&#12452;&#12474;&#12434;&#21462;&#24471;&#12377;&#12427;&#12383;&#12417;&#12395;&#20351;&#29992;&#12373;&#12428;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="656.5" y="1346.3389">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.4668"
                  x="656.5" y="1363.6299">- Entity (superclass): provides position and life-management methods.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.1567"
                  x="656.5" y="1380.9209">- GameWindow / Player: provide screen conversion and particle management.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1016"
                  x="656.5" y="1398.2119">- FrameApp: used to obtain tile size.
            </text>
