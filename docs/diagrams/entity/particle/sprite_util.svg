        <g class="entity" id="ent0023">
            <path d="M778,6 L778,249 L721.77,253 L778,257 L778,500.1484 A0,0 0 0 0 778,500.1484 L1551.9399,500.1484 A0,0 0 0 0 1551.9399,500.1484 L1551.9399,16 L1541.9399,6 L778,6 A0,0 0 0 0 778,6"
                  fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
            <path d="M1541.9399,6 L1541.9399,16 L1551.9399,16 L1541.9399,6" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="784" y="25.0283">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="784" y="42.3193">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.9409"
                  x="784" y="59.6104">- &#12473;&#12503;&#12521;&#12452;&#12488;&#30011;&#20687;&#12363;&#12425;&#12300;&#30333;&#12500;&#12463;&#12475;&#12523;&#12398;&#24231;&#27161;&#12301;&#12434;&#25277;&#20986;&#12375;&#12289;&#20877;&#21033;&#29992;&#12398;&#12383;&#12417;&#12395;&#12461;&#12515;&#12483;&#12471;&#12517;&#12377;&#12427;&#12518;&#12540;&#12486;&#12451;&#12522;&#12486;&#12451;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="76.9014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.9185"
                  x="784" y="94.1924">- Utility for extracting coordinates of white pixels from sprite images and
                caching the results for reuse.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="111.4834">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9917"
                  x="784" y="128.7744">Key behaviors:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.8589"
                  x="784" y="146.0654">- findWhitePixelCentersCached: &#12461;&#12515;&#12483;&#12471;&#12517;&#12434;&#21442;&#29031;&#12375;&#12289;&#26410;&#30331;&#37682;&#12394;&#12425;&#36208;&#26619;&#12375;&#12390;&#32080;&#26524;&#12434;&#20445;&#23384;&#12375;&#12390;&#36820;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.0435"
                  x="784" y="163.3564">- findWhitePixelCenters: &#30011;&#20687;&#12434;&#36208;&#26619;&#12375;&#12390;&#12450;&#12523;&#12501;&#12449;&gt;0&#12363;&#12388;RGB&#12364;&#38334;&#20516;&#12434;&#36229;&#12360;&#12427;&#12500;&#12463;&#12475;&#12523;&#12434;&#30333;&#12392;&#12375;&#12390;&#24231;&#27161;&#12434;&#21454;&#38598;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="180.6475">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="752.9399"
                  x="784" y="197.9385">- findWhitePixelCentersCached: returns cached coordinates if available; otherwise
                scans the image, caches, and returns the result.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="737.4263"
                  x="784" y="215.2295">- findWhitePixelCenters: scans every pixel and treats a pixel as white when alpha
                &gt; 0 and RGB components exceed a threshold.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="232.5205">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9053"
                  x="784" y="249.8115">Implementation notes:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="660.918"
                  x="784" y="267.1025">- &#12461;&#12515;&#12483;&#12471;&#12517;&#12399; WeakHashMap &#12434;&#20351;&#29992;&#12375;&#12390;&#12362;&#12426;&#12289;BufferedImage
                &#12364;&#20182;&#12391;&#21442;&#29031;&#12373;&#12428;&#12394;&#12367;&#12394;&#12428;&#12400;&#33258;&#21205;&#30340;&#12395;&#22238;&#21454;&#12373;&#12428;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="475.6172"
                  x="784" y="284.3936">- &#30333;&#21028;&#23450;&#12398;&#38334;&#20516;&#12399;&#22266;&#23450;&#65288;RGB
                &gt; 230&#65289;&#12384;&#12364;&#12289;&#12473;&#12503;&#12521;&#12452;&#12488;&#12398;&#30011;&#39080;&#12395;&#24540;&#12376;&#12390;&#35519;&#25972;&#21487;&#33021;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.958"
                  x="784" y="301.6846">- null &#20837;&#21147;&#26178;&#12399; Collections.emptyList() &#12434;&#36820;&#12377;&#12383;&#12417;&#21628;&#12403;&#20986;&#12375;&#20596;&#12391;&#12398;
                null &#12481;&#12455;&#12483;&#12463;&#12364;&#19981;&#35201;&#12395;&#12394;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="318.9756">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="730.5708"
                  x="784" y="336.2666">- Uses a WeakHashMap for the cache so BufferedImage keys can be garbage-collected
                when no longer referenced elsewhere.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="545.9238"
                  x="784" y="353.5576">- The white-detection threshold is currently RGB &gt; 230 and can be tuned for
                different art styles.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.0278"
                  x="784" y="370.8486">- Returns Collections.emptyList() for null input to simplify caller logic.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="388.1396">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3271"
                  x="784" y="405.4307">Considerations:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="668.8271"
                  x="784" y="422.7217">- BufferedImage &#12434;&#12461;&#12540;&#12395;&#12375;&#12390;&#12356;&#12427;&#12383;&#12417;&#12289;&#21516;&#19968;&#30011;&#20687;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12434;&#20351;&#12356;&#22238;&#12377;&#12371;&#12392;&#12364;&#12461;&#12515;&#12483;&#12471;&#12517;&#12498;&#12483;&#12488;&#12398;&#26465;&#20214;&#12395;&#12394;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="462.9409"
                  x="784" y="440.0127">- &#22823;&#12365;&#12394;&#30011;&#20687;&#12420;&#22810;&#25968;&#12398;&#30064;&#12394;&#12427;&#30011;&#20687;&#12434;&#25201;&#12358;&#22580;&#21512;&#12399;&#12513;&#12514;&#12522;&#12392;&#36208;&#26619;&#12467;&#12473;&#12488;&#12395;&#27880;&#24847;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="784" y="457.3037">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="440.0767"
                  x="784" y="474.5947">- Cache hits require the same BufferedImage object to be reused as the key.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="749.2646"
                  x="784" y="491.8857">- For many or very large images, consider sampling, lower thresholds, or
                precomputing during asset import to reduce runtime cost.
            </text>
        </g><!--link SpriteUtil to BufferedImage-->
