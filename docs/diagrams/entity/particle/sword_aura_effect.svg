        <g class="entity" id="ent0031">
            <path d="M802,6 L802,379 L594.18,383 L802,387 L802,759.5137 A0,0 0 0 0 802,759.5137 L2005.7715,759.5137 A0,0 0 0 0 2005.7715,759.5137 L2005.7715,16 L1995.7715,6 L802,6 A0,0 0 0 0 802,6"
                  fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
            <path d="M1995.7715,6 L1995.7715,16 L2005.7715,16 L1995.7715,6" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="808" y="25.0283">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="808" y="42.3193">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.9409"
                  x="808" y="59.6104">- &#21091;&#12473;&#12503;&#12521;&#12452;&#12488;&#12395;&#32016;&#12389;&#12367;&#12464;&#12525;&#12540;&#34920;&#31034;&#12392;&#12289;&#12473;&#12503;&#12521;&#12452;&#12488;&#19978;&#12398;&#30333;&#12500;&#12463;&#12475;&#12523;&#12395;&#27839;&#12387;&#12383;&#31890;&#23376;&#29983;&#25104;&#12434;&#31649;&#29702;&#12377;&#12427;&#12463;&#12521;&#12473;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="76.9014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="557.832"
                  x="808" y="94.1924">- Manages a glow overlay for a sword sprite and spawns particles along white
                pixels of the sprite.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="111.4834">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.2891"
                  x="808" y="128.7744">Fields:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.9199"
                  x="808" y="146.0654">- gameWindow: &#25551;&#30011;&#12420;&#12497;&#12540;&#12486;&#12451;&#12463;&#12523;&#12522;&#12473;&#12488;&#12289;&#12503;&#12524;&#12452;&#12516;&#12540;&#24231;&#27161;&#21462;&#24471;&#12395;&#20351;&#12358;&#21442;&#29031;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.6963"
                  x="808" y="163.3564">- owner: &#12456;&#12501;&#12455;&#12463;&#12488;&#12434;&#25345;&#12388; Entity&#65288;&#12503;&#12525;&#12472;&#12455;&#12463;&#12479;&#12452;&#12523;&#12420;&#12503;&#12524;&#12452;&#12516;&#12540;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.9536"
                  x="808" y="180.6475">- sprite: &#21091;&#12398;&#12473;&#12503;&#12521;&#12452;&#12488;&#30011;&#20687;&#65288;&#21521;&#12365;&#12395;&#24540;&#12376;&#12383;&#12418;&#12398;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.0317"
                  x="808" y="197.9385">- glowImage: &#12473;&#12503;&#12521;&#12452;&#12488;&#12363;&#12425;&#29983;&#25104;&#12375;&#12383;&#12464;&#12525;&#12540;&#30011;&#20687;&#65288;&#12461;&#12515;&#12483;&#12471;&#12517;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="442.0317"
                  x="808" y="215.2295">- whiteCenters: &#12473;&#12503;&#12521;&#12452;&#12488;&#20869;&#12398;&#30333;&#12500;&#12463;&#12475;&#12523;&#24231;&#27161;&#12522;&#12473;&#12488;&#65288;&#12461;&#12515;&#12483;&#12471;&#12517;&#28168;&#12415;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.7026"
                  x="808" y="232.5205">- rnd: &#12469;&#12531;&#12503;&#12522;&#12531;&#12464;&#12420;&#25594;&#12425;&#12366;&#12395;&#20351;&#12358;
                Random&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.0361"
                  x="808" y="249.8115">- spawnCounter / spawnInterval: &#31890;&#23376;&#29983;&#25104;&#12398;&#12479;&#12452;&#12511;&#12531;&#12464;&#21046;&#24481;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.1372"
                  x="808" y="267.1025">- particleColor: &#29983;&#25104;&#12377;&#12427;&#31890;&#23376;&#12398;&#33394;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="284.3936">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="641.6338"
                  x="808" y="301.6846">- gameWindow: reference used for rendering, particle list access, and
                player-based world-to-screen conversion.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.3696"
                  x="808" y="318.9756">- owner: the Entity that owns this effect (projectile or player).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.4307"
                  x="808" y="336.2666">- sprite: the sword sprite image (direction-specific).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.876"
                  x="808" y="353.5576">- glowImage: cached glow image derived from the sprite.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5786"
                  x="808" y="370.8486">- whiteCenters: cached list of white pixel coordinates within the sprite.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.1333"
                  x="808" y="388.1396">- rnd: Random for sampling and slight variation.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.665"
                  x="808" y="405.4307">- spawnCounter / spawnInterval: control particle spawn timing.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.0215"
                  x="808" y="422.7217">- particleColor: default color for spawned particles.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="440.0127">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9917"
                  x="808" y="457.3037">Key behaviors:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.5845"
                  x="808" y="474.5947">- update(): &#25152;&#26377;&#32773;&#12364;&#29983;&#23384;&#12375;&#12390;&#12356;&#12427;&#22580;&#21512;&#12395;&#12459;&#12454;&#12531;&#12479;&#12434;&#36914;&#12417;&#12289;&#25152;&#23450;&#38291;&#38548;&#12391;&#31890;&#23376;&#12434;&#29983;&#25104;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="499.1162"
                  x="808" y="491.8857">- draw(Graphics2D): &#12527;&#12540;&#12523;&#12489;&#8594;&#12473;&#12463;&#12522;&#12540;&#12531;&#22793;&#25563;&#12434;&#34892;&#12356;&#12289;glowImage
                &#12434;&#37325;&#12397;&#25551;&#30011;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="879.0933"
                  x="808" y="509.1768">- spawnParticlesFromWhitePixels(): whiteCenters &#12434;&#12469;&#12531;&#12503;&#12522;&#12531;&#12464;&#12375;&#12390;
                SwordAuraParticle &#12434;&#29983;&#25104;&#12375;&#12289;GameWindow &#12398;&#12497;&#12540;&#12486;&#12451;&#12463;&#12523;&#12522;&#12473;&#12488;&#12395;&#36861;&#21152;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="526.4678">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="618.5283"
                  x="808" y="543.7588">- update(): increments spawn counter and triggers particle spawning at configured
                intervals if owner is alive.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="646.6865"
                  x="808" y="561.0498">- draw(Graphics2D): converts world to screen coordinates and draws the glowImage
                with appropriate composite.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1182.7715"
                  x="808" y="578.3408">- spawnParticlesFromWhitePixels(): samples whiteCenters, converts sprite-local
                coordinates to world coordinates, creates SwordAuraParticle instances, and appends them to
                GameWindow.getParticleList().
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="595.6318">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9053"
                  x="808" y="612.9229">Implementation notes:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.4199"
                  x="808" y="630.2139">- whiteCenters &#12399;&#12473;&#12503;&#12521;&#12452;&#12488;&#21336;&#20301;&#12391;&#20107;&#21069;&#12395;&#31639;&#20986;&#12539;&#12461;&#12515;&#12483;&#12471;&#12517;&#12375;&#12390;&#12362;&#12367;&#12392;&#39640;&#36895;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="637.7871"
                  x="808" y="647.5049">- &#12473;&#12503;&#12521;&#12452;&#12488;&#20013;&#24515;&#22522;&#28310;&#12398;&#12458;&#12501;&#12475;&#12483;&#12488;&#35336;&#31639;&#65288;centerX/centerY&#65289;&#12392;
                owner &#12398;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12398;&#25201;&#12356;&#12395;&#27880;&#24847;&#12377;&#12427;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="485.3735"
                  x="808" y="664.7959">- &#12469;&#12531;&#12503;&#12522;&#12531;&#12464;&#29575;&#12420; spawnInterval
                &#12399;&#12497;&#12501;&#12457;&#12540;&#12510;&#12531;&#12473;&#12392;&#34920;&#29694;&#12398;&#12496;&#12521;&#12531;&#12473;&#12391;&#35519;&#25972;&#21487;&#33021;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="682.0869">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.2813"
                  x="808" y="699.3779">- Cache white pixel centers per sprite to avoid repeated expensive scans.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="480.5303"
                  x="808" y="716.6689">- Ensure coordinate conversion accounts for sprite center and owner world
                position.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="515.9565"
                  x="808" y="733.96">- Tune sampling probability and spawnInterval to balance visual density and
                performance.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="808" y="751.251">&#160;
            </text>
        </g><!--link SwordAuraEffect to GameWindow-->
