            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.498"
                  x="858" y="803.124">- gameWindow.getPlayer() &#12434;&#20351;&#12387;&#12390;&#12527;&#12540;&#12523;&#12489;&#8594;&#12473;&#12463;&#12522;&#12540;&#12531;&#24231;&#27161;&#12395;&#22793;&#25563;&#12377;&#12427;&#12290;
