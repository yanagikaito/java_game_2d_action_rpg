            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="858" y="42.3193">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="579.9409"
                  x="858" y="59.6104">- &#21091;&#12398;&#12458;&#12540;&#12521;&#34920;&#29694;&#29992;&#12398;&#31890;&#23376;&#12290;&#35282;&#24230;&#12392;&#36895;&#24230;&#12391;&#31227;&#21205;&#12375;&#12289;&#37325;&#21147;&#12392;&#22238;&#36578;&#12289;&#12501;&#12455;&#12540;&#12489;&#12450;&#12454;&#12488;&#12434;&#20276;&#12358;&#25551;&#30011;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="858" y="76.9014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="653.2119"
                  x="858" y="94.1924">- Particle used for sword aura effects; moves by angle-derived velocity, affected
                by gravity, rotates, and fades out.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="858" y="111.4834">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.2891"
                  x="858" y="128.7744">Fields:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="444.9199"
                  x="858" y="146.0654">- gameWindow: &#12527;&#12540;&#12523;&#12489;&#8594;&#12473;&#12463;&#12522;&#12540;&#12531;&#22793;&#25563;&#12392;&#12497;&#12540;&#12486;&#12451;&#12463;&#12523;&#31649;&#29702;&#12395;&#20351;&#12358;&#21442;&#29031;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.3882"
                  x="858" y="163.3564">- vx, vy: &#27700;&#24179;&#12539;&#22402;&#30452;&#12398;&#36895;&#24230;&#25104;&#20998;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.6772"
                  x="858" y="180.6475">- gravity: &#27598;&#12501;&#12524;&#12540;&#12512; vy &#12395;&#21152;&#31639;&#12373;&#12428;&#12427;&#37325;&#21147;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.7427"
                  x="858" y="197.9385">- initLife: &#21021;&#26399;&#12521;&#12452;&#12501;&#65288;&#12450;&#12523;&#12501;&#12449;&#35336;&#31639;&#12395;&#20351;&#29992;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.2827"
                  x="858" y="215.2295">- size: &#25551;&#30011;&#12469;&#12452;&#12474;&#65288;&#12500;&#12463;&#12475;&#12523;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3418"
                  x="858" y="232.5205">- color: &#25551;&#30011;&#33394;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1162"
                  x="858" y="249.8115">- rotationSpeed: &#12501;&#12524;&#12540;&#12512;&#12372;&#12392;&#12398;&#35282;&#24230;&#22793;&#21270;&#37327;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.9727"
                  x="858" y="267.1025">- angle: &#29694;&#22312;&#12398;&#22238;&#36578;&#35282;&#24230;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="858" y="284.3936">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.3022"
                  x="858" y="301.6846">- gameWindow: reference for world-to-screen conversion and particle list access.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.8506"
                  x="858" y="318.9756">- vx, vy: horizontal and vertical velocity components.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.918"
                  x="858" y="336.2666">- gravity: per-frame gravity applied to vy.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.2705"
                  x="858" y="353.5576">- initLife: initial life used to compute alpha fade.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.7007"
                  x="858" y="370.8486">- size: rendered diameter in pixels.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6499"
                  x="858" y="388.1396">- color: particle color.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.7451"
                  x="858" y="405.4307">- rotationSpeed: per-frame angular increment.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.437"
                  x="858" y="422.7217">- angle: current rotation angle.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="858" y="440.0127">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.8018"
                  x="858" y="457.3037">Constructor:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="701.5938"
                  x="858" y="474.5947">- SwordAuraParticle(GameWindow, Entity, originX, originY, Color, size, maxLife,
                angleRad, speed, gravity, rotationSpeed)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="559.0952"
                  x="858" y="491.8857">- angleRad &#12392; speed &#12363;&#12425; vx/vy &#12434;&#31639;&#20986;&#12375;&#12289;origin
                &#12434;&#20013;&#24515;&#12395;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12392;&#12521;&#12452;&#12501;&#12434;&#21021;&#26399;&#21270;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="858" y="509.1768">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="701.5938"
                  x="858" y="526.4678">- SwordAuraParticle(GameWindow, Entity, originX, originY, Color, size, maxLife,
                angleRad, speed, gravity, rotationSpeed)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="520.2666"
                  x="858" y="543.7588">- Computes vx/vy from angleRad and speed, centers world position on origin, and
                sets life.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="858" y="561.0498">&#160;
            </text>
