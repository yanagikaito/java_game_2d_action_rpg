            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.1646"
                  x="858" y="612.9229">- vx/vy &#12391;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12434;&#26356;&#26032;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5361"
                  x="858" y="630.2139">- angle &#12434; rotationSpeed &#12391;&#22679;&#21152;&#12373;&#12379;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.7827"
