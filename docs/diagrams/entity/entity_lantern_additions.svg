            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432.6626"
                  x="610" y="614.915">- &#12487;&#12501;&#12457;&#12523;&#12488;&#12391;&#12399;&#20809;&#28304;&#12391;&#12399;&#12394;&#12356;&#25391;&#12427;&#33310;&#12356;&#65288;isLightSource()
                &#12399; false &#12434;&#36820;&#12377;&#65289;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.4961"
                  x="610" y="632.2061">- &#20809;&#12398;&#21322;&#24452;&#12392;&#24375;&#24230;&#12434;&#21462;&#24471;&#12377;&#12427;&#12450;&#12463;&#12475;&#12469;&#65288;getLightRadius()
                / getLightIntensity()&#65289;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="610" y="649.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.9478"
                  x="610" y="666.7881">- store reference to equipped light source (currentLight)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.1851"
                  x="610" y="684.0791">- default non-light behavior: isLightSource() -&gt; false
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3252"
                  x="610" y="701.3701">- accessors for light radius and intensity
            </text>
