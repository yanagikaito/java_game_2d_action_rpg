            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.3984"
                  x="1103" y="118.833">- &#25991;&#23383;&#21015; "up/down/left/right" &#12398;&#21453;&#23550;&#12434;&#36820;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.5049"
                  x="1103" y="136.124">- Returns the opposite of "up"/"down"/"left"/"right".
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1103" y="153.415">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.3018"
                  x="1103" y="170.7061">attacking():
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.9409"
                  x="1103" y="187.9971">- &#12473;&#12503;&#12521;&#12452;&#12488;&#12459;&#12454;&#12531;&#12479;&#12434;&#36914;&#12417;&#12289;&#38334;&#20516;&#12434;&#36229;&#12360;&#12383;&#12425;&#12501;&#12524;&#12540;&#12512;&#12434;&#20999;&#26367;&#12360;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="471.1421"
                  x="1103" y="205.2881">- Advances sprite counter and cycles animation frames when threshold exceeded.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="577.1353"
                  x="1103" y="222.5791">- &#25915;&#25731;&#21028;&#23450;&#12508;&#12483;&#12463;&#12473;&#65288;attackArea&#65289;&#12392;&#12503;&#12524;&#12452;&#12516;&#12540;&#12398;&#24403;&#12383;&#12426;&#21028;&#23450;&#12364;&#20132;&#24046;&#12375;&#12383;&#12425;
                damagePlayer &#12434;&#21628;&#12406;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="686.0864"
                  x="1103" y="239.8701">- Builds an attack bounding box and, if it intersects the player's box and the
                player is not invincible, calls damagePlayer.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.0508"
                  x="1103" y="257.1611">- attackCooldown &#12434;&#12522;&#12475;&#12483;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.1226"
                  x="1103" y="274.4521">- Resets attackCooldown.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1103" y="291.7432">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.0972"
                  x="1103" y="309.0342">damagePlayer():
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.9409"
                  x="1103" y="326.3252">- &#12503;&#12524;&#12452;&#12516;&#12540;&#12364;&#28961;&#25973;&#12391;&#12394;&#12369;&#12428;&#12400;&#12480;&#12513;&#12540;&#12472;&#35336;&#31639;&#12434;&#34892;&#12358;&#65288;&#38450;&#24481;&#24046;&#20998;&#12434;&#32771;&#24942;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.2104"
                  x="1103" y="343.6162">- If player is not invincible, compute damage considering player's defense.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="631.9409"
                  x="1103" y="360.9072">- &#12503;&#12524;&#12452;&#12516;&#12540;&#12364;&#12460;&#12540;&#12489;&#20013;&#12363;&#12388;&#30462;&#12434;&#35013;&#20633;&#12375;&#12390;&#12356;&#12427;&#22580;&#21512;&#12399;&#12480;&#12513;&#12540;&#12472;&#36605;&#28187;&#12392;&#12460;&#12540;&#12489;&#20966;&#29702;&#65288;&#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12539;&#21177;&#26524;&#38899;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="668.4717"
                  x="1103" y="378.1982">- If player is guarding with a shield and facing the correct direction, reduce
                damage and show guarded popup/sound.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.9409"
                  x="1103" y="395.4893">- &#12460;&#12540;&#12489;&#22833;&#25943;&#26178;&#12399;&#36879;&#26126;&#21270;&#12539;&#12494;&#12483;&#12463;&#12496;&#12483;&#12463;&#12539;&#28961;&#25973;&#21270;&#12539;&#12480;&#12513;&#12540;&#12472;&#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12539;&#21177;&#26524;&#38899;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="935.0986"
                  x="1103" y="412.7803">- On failed guard: play damage sound, set player transparent, apply knockback,
                reduce life, show damage popup, set player invincible and reset invincible counter.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.9517"
                  x="1103" y="430.0713">- &#12503;&#12524;&#12452;&#12516;&#12540;&#12398;&#12521;&#12452;&#12501;&#12364;
                0 &#20197;&#19979;&#12394;&#12425; GameState &#12434; GAME_OVER &#12395;&#36983;&#31227;&#12373;&#12379;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.9971"
                  x="1103" y="447.3623">- If player's life &lt;= 0, set GameState to GAME_OVER.
            </text>
