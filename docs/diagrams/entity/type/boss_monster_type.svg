            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.0386"
                  x="310.5" y="299.624">- SwordType, AxeType, ShieldType, RedPotionType, GreenPotionType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.3613"
                  x="310.5" y="316.915">- BluePotionType, PickupOnlyType, BombType, BossMonsterType, ChestType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.3462"
                  x="310.5" y="334.2061">- PotType, RockType &#12398;&#12415;&#12364; EntityType &#12434;&#23455;&#35013;&#12391;&#12365;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="444.2407"
                  x="310.5" y="351.4971">- &#12487;&#12501;&#12457;&#12523;&#12488;&#12513;&#12477;&#12483;&#12489;:
