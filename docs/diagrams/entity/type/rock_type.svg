            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.6606"
                  x="310" y="282.333">- &#12471;&#12540;&#12523;&#12489;&#12452;&#12531;&#12479;&#12540;&#12501;&#12455;&#12540;&#12473;:
                PlayerType&#12289;NpcType&#12289;MonsterType&#12289;ChickenType&#12289;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.5322"
                  x="310" y="299.624">- SwordType&#12289;AxeType&#12289;ShieldType&#12289;RedPotionType&#12289;GreenPotionType&#12289;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="825.0366"
                  x="310" y="316.915">- BluePotionType&#12289;PickupOnlyType&#12289;BombType&#12289;BossMonsterType&#12289;ChestType&#12289;PotType&#12289;RockType
                &#12398;&#12415;&#12364; EntityType &#12434;&#23455;&#35013;&#12391;&#12365;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.2407"
                  x="310" y="334.2061">- &#12487;&#12501;&#12457;&#12523;&#12488;&#12513;&#12477;&#12483;&#12489;:
                isHostileToPlayer() &#12392; canRespawn() &#12399;&#12487;&#12501;&#12457;&#12523;&#12488;&#12391; true
                &#12434;&#36820;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="310" y="351.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.2368"
                  x="310" y="368.7881">- Sealed interface: Only PlayerType, NpcType, MonsterType, ChickenType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.0386"
                  x="310" y="386.0791">- SwordType, AxeType, ShieldType, RedPotionType, GreenPotionType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.3613"
                  x="310" y="403.3701">- BluePotionType, PickupOnlyType, BombType, BossMonsterType, ChestType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.7852"
                  x="310" y="420.6611">- PotType, and RockType may implement EntityType.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.5386"
                  x="310" y="437.9521">- Default methods: isHostileToPlayer() and canRespawn() return true by default.
            </text>
