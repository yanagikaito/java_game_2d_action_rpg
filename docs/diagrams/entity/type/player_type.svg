            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.2368"
                  x="310.5" y="386.0791">- Sealed interface: Only PlayerType, NpcType, MonsterType, ChickenType,
