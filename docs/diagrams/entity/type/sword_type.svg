            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.0386"
                  x="310" y="299.624">- SwordType, AxeType, ShieldType, RedPotionType, GreenPotionType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.3613"
                  x="310" y="316.915">- BluePotionType, PickupOnlyType, BombType, BossMonsterType, ChestType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.3462"
                  x="310" y="334.2061">- PotType, RockType &#12398;&#12415;&#12364; EntityType &#12434;&#23455;&#35013;&#12391;&#12365;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.2407"
                  x="310" y="351.4971">- &#12487;&#12501;&#12457;&#12523;&#12488;&#12513;&#12477;&#12483;&#12489;:
                isHostileToPlayer() &#12392; canRespawn() &#12399; true &#12434;&#36820;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="310" y="368.7881">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.2368"
                  x="310" y="386.0791">- Sealed interface: Only PlayerType, NpcType, MonsterType, ChickenType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.0386"
                  x="310" y="403.3701">- SwordType, AxeType, ShieldType, RedPotionType, GreenPotionType,
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="760.8174"
                  x="310" y="420.6611">- BluePotionType, PickupOnlyType, BombType, BossMonsterType, ChestType, PotType,
                and RockType may implement EntityType.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.5386"
                  x="310" y="437.9521">- Default methods: isHostileToPlayer() and canRespawn() return true by default.
            </text>
