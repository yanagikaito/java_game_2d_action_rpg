                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="240.5" y="25.0283">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="240.5" y="42.3193">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.9409"
                  x="240.5" y="59.6104">- &#12489;&#12525;&#12483;&#12503;&#35373;&#23450;&#12398;&#21336;&#19968;&#12456;&#12531;&#12488;&#12522;&#12434;&#34920;&#12377;&#12471;&#12531;&#12503;&#12523;&#12394;&#12487;&#12540;&#12479;&#12463;&#12521;&#12473;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="76.9014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.0913"
                  x="240.5" y="94.1924">- Represents a single loot configuration entry as a simple data class.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="111.4834">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.9727"
                  x="240.5" y="128.7744">Key fields:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.7363"
                  x="240.5" y="146.0654">- type: &#12489;&#12525;&#12483;&#12503;&#12373;&#12428;&#12427;&#12450;&#12452;&#12486;&#12512;&#21517;&#12420;&#12459;&#12486;&#12468;&#12522;&#12434;&#35672;&#21029;&#12377;&#12427;&#25991;&#23383;&#21015;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.7427"
                  x="240.5" y="163.3564">- weight: &#12489;&#12525;&#12483;&#12503;&#36984;&#25246;&#26178;&#12398;&#37325;&#12415;&#12290;&#20516;&#12364;&#22823;&#12365;&#12356;&#12411;&#12393;&#36984;&#12400;&#12428;&#12420;&#12377;&#12356;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="180.6475">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.1104"
                  x="240.5" y="197.9385">- type: A string that identifies the item name or category to be dropped.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="629.3892"
                  x="240.5" y="215.2295">- weight: An integer weight used when selecting drops; larger values make the
                entry more likely to be chosen.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="232.5205">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2471"
                  x="240.5" y="249.8115">Intended usage:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="540.3633"
                  x="240.5" y="267.1025">- LootTable &#12420; LootPool &#12364;&#35079;&#25968;&#12398; LootConfigEntry
                &#12434;&#20445;&#25345;&#12375;&#12289;&#37325;&#12415;&#20184;&#12365;&#12521;&#12531;&#12480;&#12512;&#36984;&#25246;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432.6245"
                  x="240.5" y="284.3936">- &#35373;&#23450;&#12501;&#12449;&#12452;&#12523;&#65288;JSON/YAML&#65289;&#12363;&#12425;&#35501;&#12415;&#36796;&#12435;&#12391;&#12452;&#12531;&#12473;&#12479;&#12531;&#12473;&#21270;&#12377;&#12427;&#24819;&#23450;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="301.6846">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="628.6846"
                  x="240.5" y="318.9756">- A LootTable or LootPool holds multiple LootConfigEntry instances and performs
                weighted random selection.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.083"
                  x="240.5" y="336.2666">- Instances are expected to be created by loading configuration files
                (JSON/YAML).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="353.5576">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9053"
                  x="240.5" y="370.8486">Implementation notes:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="733.8398"
                  x="240.5" y="388.1396">- &#12501;&#12451;&#12540;&#12523;&#12489;&#12364; public &#12395;&#12394;&#12387;&#12390;&#12356;&#12427;&#12383;&#12417;&#12289;&#22806;&#37096;&#12363;&#12425;&#30452;&#25509;&#22793;&#26356;&#12373;&#12428;&#12427;&#12290;&#19981;&#22793;&#24615;&#12434;&#20445;&#12385;&#12383;&#12356;&#22580;&#21512;&#12399;
                private &#12395;&#12375;&#12390; getter &#12434;&#29992;&#12356;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.1309"
                  x="240.5" y="405.4307">- weight &#12364;&#36000;&#12398;&#20516;&#12420;&#12476;&#12525;&#12395;&#12394;&#12425;&#12394;&#12356;&#12424;&#12358;&#12496;&#12522;&#12487;&#12540;&#12471;&#12519;&#12531;&#12434;&#34892;&#12358;&#12392;&#23433;&#20840;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.1245"
                  x="240.5" y="422.7217">- type &#12434;&#21015;&#25369;&#22411;&#12420;&#23450;&#25968;&#12391;&#31649;&#29702;&#12377;&#12427;&#12392;&#12479;&#12452;&#12503;&#12511;&#12473;&#12434;&#38450;&#12370;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="240.5" y="440.0127">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="684.9819"
                  x="240.5" y="457.3037">- Fields are public, so they can be modified externally. If immutability is
                desired, make them private and provide getters.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.543"
                  x="240.5" y="474.5947">- Validate that weight is not negative or zero to avoid invalid selection
                behavior.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="511.6021"
                  x="240.5" y="491.8857">- Consider using an enum or constants for type to prevent typos and improve
                type safety.
            </text>
        </g>
