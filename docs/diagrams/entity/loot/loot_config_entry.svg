        <g class="entity" id="ent0006">
            <path d="M234.5,6 L234.5,249 L178.41,253 L234.5,257 L234.5,500.1484 A0,0 0 0 0 234.5,500.1484 L989.3398,500.1484 A0,0 0 0 0 989.3398,500.1484 L989.3398,16 L979.3398,6 L234.5,6 A0,0 0 0 0 234.5,6"
