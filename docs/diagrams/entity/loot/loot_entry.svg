            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="288.5" y="25.0283">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="288.5" y="42.3193">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.4009"
                  x="288.5" y="59.6104">- &#12489;&#12525;&#12483;&#12503;&#29983;&#25104;&#29992;&#12398;&#19981;&#22793;&#12456;&#12531;&#12488;&#12522;&#12434;&#34920;&#12377;
                record&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5972"
                  x="288.5" y="76.9014">- &#24517;&#35201;&#12394;&#12392;&#12365;&#12395; Entity &#12434;&#29983;&#25104;&#12377;&#12427;&#12383;&#12417;&#12398;
                Supplier &#12434;&#20445;&#25345;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="94.1924">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0405"
                  x="288.5" y="111.4834">- Represents an immutable record for a loot spawn entry.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6904"
                  x="288.5" y="128.7744">- Holds a Supplier&lt;Entity&gt; to create an Entity on demand.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="146.0654">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.9727"
                  x="288.5" y="163.3564">Key fields:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.6099"
                  x="288.5" y="180.6475">- factory: Entity &#12434;&#29983;&#25104;&#12377;&#12427; Supplier&#12290;&#36933;&#24310;&#29983;&#25104;&#12420;&#20381;&#23384;&#27880;&#20837;&#12395;&#36969;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.7427"
                  x="288.5" y="197.9385">- weight: &#37325;&#12415;&#12290;&#37325;&#12415;&#20184;&#12365;&#12521;&#12531;&#12480;&#12512;&#36984;&#25246;&#12391;&#12398;&#20778;&#20808;&#24230;&#12434;&#31034;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="215.2295">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="601.231"
                  x="288.5" y="232.5205">- factory: Supplier&lt;Entity&gt; that produces an Entity; suitable for lazy
                instantiation or dependency injection.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.1631"
                  x="288.5" y="249.8115">- weight: Integer weight indicating priority in weighted random selection.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="267.1025">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2471"
                  x="288.5" y="284.3936">Intended usage:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.6245"
                  x="288.5" y="301.6846">- toString(): &#12487;&#12496;&#12483;&#12464;&#12420;&#12525;&#12464;&#20986;&#21147;&#21521;&#12369;&#12395;&#20869;&#23481;&#12434;&#20998;&#12363;&#12426;&#12420;&#12377;&#12367;&#34920;&#31034;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="318.9756">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.5493"
                  x="288.5" y="336.2666">- toString(): Provides a readable representation for debugging and logging.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="353.5576">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9053"
                  x="288.5" y="370.8486">Implementation notes:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="462.249"
                  x="288.5" y="388.1396">- record &#12395;&#12424;&#12426;&#12501;&#12451;&#12540;&#12523;&#12489;&#12399;&#19981;&#22793;&#65288;final&#65289;&#12391;&#12473;&#12524;&#12483;&#12489;&#12475;&#12540;&#12501;&#12394;&#35501;&#12415;&#21462;&#12426;&#12364;&#23481;&#26131;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.249"
                  x="288.5" y="405.4307">- Supplier &#12398;&#29983;&#25104;&#12467;&#12473;&#12488;&#12420;&#20363;&#22806;&#12434;&#21628;&#12403;&#20986;&#12375;&#20596;&#12391;&#25201;&#12358;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.1309"
                  x="288.5" y="422.7217">- weight &#12398;&#12496;&#12522;&#12487;&#12540;&#12471;&#12519;&#12531;&#65288;&#36000;&#20516;&#12420;&#12476;&#12525;&#12398;&#25201;&#12356;&#65289;&#12434;&#35373;&#35336;&#12391;&#27770;&#12417;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="673.8608"
                  x="288.5" y="440.0127">- &#35373;&#23450;&#12501;&#12449;&#12452;&#12523;&#12363;&#12425;&#35501;&#12415;&#36796;&#12416;&#22580;&#21512;&#12399;
                Supplier &#12398;&#24489;&#20803;&#26041;&#27861;&#65288;&#12522;&#12501;&#12524;&#12463;&#12471;&#12519;&#12531;&#12420;&#12501;&#12449;&#12463;&#12488;&#12522;&#12510;&#12483;&#12500;&#12531;&#12464;&#65289;&#12434;&#26126;&#30906;&#12395;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="288.5" y="457.3037">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="452.3022"
                  x="288.5" y="474.5947">- As a record, fields are immutable (final) and safe for simple concurrent
                reads.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="440.8003"
                  x="288.5" y="491.8857">- Call sites should handle potential exceptions or high cost from the Supplier.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="572.3047"
                  x="288.5" y="509.1768">- Decide where to validate weight (e.g., loader or selection logic) to prevent
                negative or zero values.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="737.7563"
                  x="288.5" y="526.4678">- When loading from configuration, define how to reconstruct Supplier instances
                (reflection, factory mapping, or other strategies).
            </text>
        </g><!--link LootEntry to Supplier-->
