            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.9307"
                  x="1194" y="131.833">- update(delta) &#12391; WorldTimeCycle &#12434;&#26356;&#26032;&#12375;
                brightness &#12434;&#21462;&#24471;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="535.374"
                  x="1194" y="149.124">- Player &#12398; currentLight &#12434;&#21442;&#29031;&#12375;&#12390;
                hasLantern, lanternRadius, lanternIntensity &#12434;&#31639;&#20986;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="663.8569"
                  x="1194" y="166.415">- Lighting.updateAndMaybeRecreate(...) &#12395;&#26172;&#22812;&#26126;&#12427;&#12373;&#12392;&#12521;&#12531;&#12479;&#12531;&#12497;&#12521;&#12513;&#12540;&#12479;&#12434;&#28193;&#12375;&#12390;&#12501;&#12451;&#12523;&#12479;&#20877;&#29983;&#25104;&#12434;&#21028;&#23450;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1194" y="183.7061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.0112"
                  x="1194" y="200.9971">- Update(delta) updates the WorldTimeCycle and obtains the current brightness.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="550.9575"
                  x="1194" y="218.2881">- It reads the Player's currentLight to determine hasLantern, lanternRadius, and
                lanternIntensity.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="784.7798"
                  x="1194" y="235.5791">- It passes day/night brightness and lantern parameters to
                Lighting.updateAndMaybeRecreate(...) to decide whether to recreate the filter.
            </text>
        </g>
