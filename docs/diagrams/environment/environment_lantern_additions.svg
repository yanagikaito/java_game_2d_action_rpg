            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1503.5" y="524.7061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.4458"
                  x="1503.5" y="541.9971">- Responsible for generating and caching the full-screen darkness filter.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="710.3345"
                  x="1503.5" y="559.2881">- When a lantern is equipped, it accepts additional parameters (radius,
                intensity) and adjusts the light rendering accordingly.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="530.3784"
                  x="1503.5" y="576.5791">- Re-creation occurs when screen size, center position, brightness, or lantern
