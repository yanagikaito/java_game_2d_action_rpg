            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="877.5" y="221.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="683.9409"
                  x="877.5" y="238.333">- &#26032;&#12375;&#12356;&#12461;&#12515;&#12483;&#12471;&#12517;&#29992;&#12501;&#12451;&#12540;&#12523;&#12489;&#12399;&#12521;&#12531;&#12479;&#12531;&#12398;&#26377;&#28961;&#12392;&#12381;&#12398;&#12497;&#12521;&#12513;&#12540;&#12479;&#12434;&#36861;&#36321;&#12375;&#12289;&#19981;&#35201;&#12394;&#12501;&#12451;&#12523;&#12479;&#20877;&#29983;&#25104;&#12434;&#22238;&#36991;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="745.4434"
                  x="877.5" y="255.624">- updateAndMaybeRecreate(...) &#12399;&#12521;&#12531;&#12479;&#12531;&#12497;&#12521;&#12513;&#12540;&#12479;&#12434;&#21463;&#12369;&#21462;&#12426;&#12289;&#38306;&#36899;&#12377;&#12427;&#29366;&#24907;&#22793;&#21270;&#12364;&#12354;&#12428;&#12400;
                createFilter(...) &#12434;&#21628;&#12403;&#20986;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1138.3125"
                  x="877.5" y="272.915">- createFilter(...) &#12399;&#26263;&#36578;&#12524;&#12452;&#12516;&#12540;&#12434;&#21512;&#25104;&#12375;&#12289;&#12521;&#12531;&#12479;&#12531;&#35013;&#20633;&#26178;&#12395;&#12399;
                RadialGradientPaint &#12392; DstOut &#21512;&#25104;&#12434;&#20351;&#12387;&#12390;&#12477;&#12501;&#12488;&#12394;&#20809;&#12398;&#31348;&#12434;&#20999;&#12426;&#25244;&#12365;&#12289;&#20013;&#24515;&#12395;&#23567;&#12373;&#12394;&#26965;&#20870;&#12434;&#12463;&#12522;&#12450;&#12375;&#12390;&#30906;&#23455;&#12395;&#35222;&#30028;&#12434;&#30906;&#20445;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="877.5" y="290.2061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="615.6401"
                  x="877.5" y="307.4971">- New cached state fields track last lantern presence and parameters to avoid
                unnecessary filter recreation.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="703.7964"
                  x="877.5" y="324.7881">- updateAndMaybeRecreate(...) now accepts lantern parameters and triggers
                createFilter(...) when relevant state changes.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1218.2485"
                  x="877.5" y="342.0791">- createFilter(...) composes a darkness layer and, when a lantern is present,
                uses a RadialGradientPaint and DstOut composite to carve a soft light hole; it also clears a small
                central ellipse for guaranteed visibility.
            </text>
        </g><!--link Lighting to GameWindow-->
