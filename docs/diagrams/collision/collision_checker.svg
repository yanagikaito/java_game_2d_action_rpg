            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="1120" y="81.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.4854"
                  x="1120" y="98.333">- &#12479;&#12452;&#12523;&#34909;&#31361;&#21028;&#23450;&#12399;&#29694;&#22312;&#20301;&#32622;&#12392;&#31227;&#21205;&#24460;&#12398;&#30697;&#24418;&#65288;offsetX/offsetY&#65289;&#20001;&#26041;&#12434;&#12469;&#12509;&#12540;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="525.0972"
                  x="1120" y="115.624">- &#25237;&#25842;&#29289;&#65288;ObjBomb/ObjPot/&#25237;&#12370;&#12425;&#12428;&#12383;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#65289;&#12399;&#24213;&#38754;&#12479;&#12452;&#12523;&#12434;&#20778;&#20808;&#12481;&#12455;&#12483;&#12463;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="670.9409"
                  x="1120" y="132.915">- &#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#21516;&#22763;&#12398;&#21028;&#23450;&#12399;&#26041;&#21521;&#12420;&#12458;&#12501;&#12475;&#12483;&#12488;&#12434;&#32771;&#24942;&#12375;&#12390;&#24403;&#12383;&#12426;&#21028;&#23450;&#12434;&#34892;&#12356;&#12289;&#24403;&#12383;&#12387;&#12383;&#23550;&#35937;&#12398;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#12434;&#36820;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="670.3125"
                  x="1120" y="150.2061">- InteractiveTile &#21028;&#23450;&#12399; blocking &#12434;&#20778;&#20808;&#12375;&#12390;&#21363;&#26178;&#36820;&#21364;&#12289;&#38750;
                blocking &#12399;&#12452;&#12505;&#12531;&#12488;&#29992;&#12395;&#26368;&#21021;&#12398;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#12434;&#20445;&#25345;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="641.3608"
                  x="1120" y="167.4971">- checkPlayer &#12399;&#12503;&#12524;&#12452;&#12516;&#12540;&#12392;&#12398;&#25509;&#35302;&#12434;&#21028;&#23450;&#12375;&#12289;&#29305;&#23450;&#26465;&#20214;&#65288;&#35373;&#32622;&#20013;&#12398;&#29190;&#24382;&#12420;&#20445;&#25345;&#20013;&#12398;&#12491;&#12527;&#12488;&#12522;&#31561;&#65289;&#12434;&#38500;&#22806;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="678.9453"
                  x="1120" y="184.7881">- worldSolid &#12399;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#12398;
                solidArea &#12434;&#12527;&#12540;&#12523;&#12489;&#24231;&#27161;&#12395;&#22793;&#25563;&#12375;&#12383;&#12467;&#12500;&#12540;&#12434;&#36820;&#12377;&#65288;&#20803;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12399;&#22793;&#26356;&#12375;&#12394;&#12356;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1120" y="202.0791">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="587.4692"
                  x="1120" y="219.3701">- Supports tile collision checks for both current position and projected
                movement using offsetX/offsetY.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="549.104"
                  x="1120" y="236.6611">- Prioritizes bottom-tile checks for throwable objects (e.g., ObjBomb, ObjPot,
                or thrown entities).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="644.541"
                  x="1120" y="253.9521">- Performs entity-vs-entity collision by considering direction and offsets,
                returning the index of the collided target.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="784.7036"
                  x="1120" y="271.2432">- InteractiveTile checks prioritize blocking tiles, returning immediately for
                blocking hits; non-blocking tiles are recorded for event handling.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="642.3765"
                  x="1120" y="288.5342">- checkPlayer detects contact with the player while excluding special cases
                (e.g., placed bombs, held chickens).
