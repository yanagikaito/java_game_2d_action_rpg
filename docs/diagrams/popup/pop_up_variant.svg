            <path d="M1493.4751,36.24 L1493.4751,46.24 L1503.4751,46.24 L1493.4751,36.24" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="691" y="55.2683">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.4199"
                  x="691" y="72.5593">Purpose
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="566.9409"
                  x="691" y="89.8504">- &#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12398;&#12452;&#12531;&#12473;&#12479;&#12531;&#12473;&#29992;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12503;&#12540;&#12523;&#12434;&#31649;&#29702;&#12375;&#12289;&#12381;&#12398;&#12521;&#12452;&#12501;&#12469;&#12452;&#12463;&#12523;&#12434;&#21046;&#24481;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.9409"
                  x="691" y="107.1414">- &#12450;&#12463;&#12486;&#12451;&#12502;&#12394;&#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12398;&#26356;&#26032;&#12392;&#25551;&#30011;&#12434;&#19968;&#20803;&#21270;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="691" y="124.4324">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.2939"
                  x="691" y="141.7234">- Manage an object pool for Popup instances and control their lifecycle.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6968"
                  x="691" y="159.0144">- Centralize updating and rendering of active popups.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="691" y="176.3054">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3208"
                  x="691" y="193.5964">Responsibilities
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.6646"
                  x="691" y="210.8875">- &#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12434;&#20877;&#21033;&#29992;&#12375;&#12390;&#21106;&#12426;&#24403;&#12390;&#12434;&#28187;&#12425;&#12375;
                GC &#36000;&#33655;&#12434;&#36605;&#28187;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.9409"
                  x="691" y="228.1785">- &#12450;&#12463;&#12486;&#12451;&#12502;&#19968;&#35239;&#12434;&#32173;&#25345;&#12375;&#12289;&#23551;&#21629;&#12364;&#23613;&#12365;&#12383;&#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12434;&#12503;&#12540;&#12523;&#12408;&#25147;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.9409"
                  x="691" y="245.4695">- &#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12398;&#29983;&#25104;&#12539;&#26356;&#26032;&#12539;&#25551;&#30011;&#12434;&#12473;&#12524;&#12483;&#12489;&#23433;&#20840;&#12395;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="691" y="262.7605">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.5913"
                  x="691" y="280.0515">- Reuse Popup objects to reduce allocations and GC pressure.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.0723"
                  x="691" y="297.3425">- Maintain active list, recycle expired popups back to the pool.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6777"
                  x="691" y="314.6336">- Provide thread-safe spawn/update/draw operations.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="691" y="331.9246">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.3188"
                  x="691" y="349.2156">Implementation considerations
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="797.4751"
                  x="691" y="366.5066">- &#12513;&#12477;&#12483;&#12489;&#12399;&#12473;&#12524;&#12483;&#12489;&#23433;&#20840;&#12398;&#12383;&#12417;
                synchronized &#12395;&#12394;&#12387;&#12390;&#12356;&#12427;&#12364;&#12289;drawAll &#12399;&#24517;&#12378;
                Swing &#12398; Event Dispatch Thread&#65288;EDT&#65289;&#19978;&#12391;&#21628;&#12406;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="735.9409"
                  x="691" y="383.7976">- &#12503;&#12540;&#12523;&#12364;&#26543;&#28167;&#12375;&#12383;&#22580;&#21512;&#12399;&#26032;&#12375;&#12356;&#12452;&#12531;&#12473;&#12479;&#12531;&#12473;&#12434;&#29983;&#25104;&#12377;&#12427;&#35373;&#35336;&#12395;&#12394;&#12387;&#12390;&#12356;&#12427;&#12364;&#12289;&#24517;&#35201;&#12394;&#12425;&#19978;&#38480;&#12420;&#30772;&#26820;&#12509;&#12522;&#12471;&#12540;&#12434;&#26908;&#35342;&#12377;&#12427;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.0317"
                  x="691" y="401.0886">- &#39640;&#36000;&#33655;&#26178;&#12398;&#21106;&#12426;&#24403;&#12390;&#12473;&#12497;&#12452;&#12463;&#12434;&#25233;&#12360;&#12427;&#12383;&#12417;&#12395;
                poolSize &#12434;&#35519;&#25972;&#12377;&#12427;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="691" y="418.3796">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="474.7285"
                  x="691" y="435.6707">- Methods are synchronized for thread safety; ensure drawAll is called on the
                EDT.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="556.4355"
                  x="691" y="452.9617">- When pool is exhausted new instances are created; consider an upper bound or
                eviction policy.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.4775"
                  x="691" y="470.2527">- Tune poolSize to balance memory and allocation spikes under heavy load.
            </text>
        </g>
        <g class="entity" id="ent0016">
            <path d="M1538,174.24 L1538,339.8591 L2047.9409,339.8591 L2047.9409,184.24 L2037.9409,174.24 L1538,174.24"
                  fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
            <path d="M2037.9409,174.24 L2037.9409,184.24 L2047.9409,184.24 L2037.9409,174.24" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:1;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="1544" y="193.2683">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4307"
                  x="1544" y="210.5593">Threading and performance
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.019"
                  x="1544" y="227.8504">- &#25551;&#30011;&#12420; UI &#12398;&#22793;&#26356;&#12399;&#24517;&#12378;
                Swing &#12398; EDT &#19978;&#12391;&#34892;&#12358;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.9409"
                  x="1544" y="245.1414">- &#12525;&#12483;&#12463;&#31478;&#21512;&#12434;&#26368;&#23567;&#21270;&#12377;&#12427;&#12290;&#24517;&#35201;&#12394;&#12425;&#20006;&#34892;&#12467;&#12524;&#12463;&#12471;&#12519;&#12531;&#12398;&#25505;&#29992;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="488.9409"
                  x="1544" y="262.4324">- &#12501;&#12524;&#12540;&#12512;&#33853;&#12385;&#12434;&#36991;&#12369;&#12427;&#12383;&#12417;&#12395;&#26356;&#26032;&#12398;&#12496;&#12483;&#12481;&#21270;&#12420;&#29983;&#25104;&#12524;&#12540;&#12488;&#12398;&#19978;&#38480;&#35373;&#23450;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1544" y="279.7234">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.3467"
                  x="1544" y="297.0144">- Keep drawing and UI changes on the Swing Event Dispatch Thread.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.6631"
                  x="1544" y="314.3054">- Minimize lock contention; consider using concurrent collections if needed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.853"
                  x="1544" y="331.5964">- Consider batching updates or capping spawn rate to avoid frame drops.
            </text>
        </g>
        <g class="entity" id="ent0019">
            <path d="M892,609.74 L892,775.3591 L1529.7954,775.3591 L1529.7954,619.74 L1519.7954,609.74 L892,609.74"
