            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="898" y="628.7683">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9727"
                  x="898" y="646.0593">Display logic
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.5571"
                  x="898" y="663.3504">- alpha &#12391;&#12501;&#12455;&#12540;&#12489;&#12450;&#12454;&#12488;&#12289;vy
                &#12391;&#19978;&#26041;&#21521;&#31227;&#21205;&#12289;life / maxLife &#12391;&#23551;&#21629;&#12434;&#31649;&#29702;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="616.7954"
                  x="898" y="680.6414">- icon &#12364;&#23384;&#22312;&#12377;&#12427;&#22580;&#21512;&#65288;&#20363;:
                DROP &#12496;&#12522;&#12450;&#12531;&#12488;&#65289;&#12399;&#12450;&#12452;&#12467;&#12531;&#12434;&#25551;&#30011;&#12375;&#12289;&#12486;&#12461;&#12473;&#12488;&#12392;&#32068;&#12415;&#21512;&#12431;&#12379;&#12390;&#34920;&#31034;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="521.479"
                  x="898" y="697.9324">- update() &#12392; drawAll() &#12398;&#23455;&#34892;&#12434;&#35519;&#25972;&#12375;&#12390;&#12289;&#20301;&#32622;&#12420;&#36879;&#26126;&#24230;&#12364;&#25551;&#30011;&#26178;&#12395;&#19968;&#36011;&#12377;&#12427;&#12424;&#12358;&#12395;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="898" y="715.2234">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="531.083"
                  x="898" y="732.5144">- Use alpha for fade-out, vy for upward movement, and life/maxLife for lifetime
                management.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="510.1167"
                  x="898" y="749.8054">- If icon is present (e.g., DROP variant), draw the icon and combine it with text
                rendering.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="510.8975"
                  x="898" y="767.0964">- Ensure update() and drawAll() are coordinated so position and alpha remain
                consistent.
            </text>
