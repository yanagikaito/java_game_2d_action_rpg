            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.8213"
                  x="723.5" y="225.4334">- Manage an object pool for popups and control their lifecycle.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6968"
                  x="723.5" y="242.7244">- Centralize updating and rendering of active popups.
