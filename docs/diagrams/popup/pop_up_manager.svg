            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.9409"
                  x="723.5" y="190.8514">- &#12450;&#12463;&#12486;&#12451;&#12502;&#12394;&#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#12398;&#26356;&#26032;&#12392;&#25551;&#30011;&#12434;&#19968;&#20803;&#21270;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
