            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3208"
                  x="1204" y="138.7693">Responsibilities
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.9854"
                  x="1204" y="156.0604">- &#12513;&#12477;&#12483;&#12489;&#12399; synchronized &#12391;&#12473;&#12524;&#12483;&#12489;&#23433;&#20840;&#12434;&#30906;&#20445;&#12375;&#12390;&#12356;&#12427;&#12364;&#12289;&#25551;&#30011;&#12399;
                EDT &#12391;&#34892;&#12358;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="540.9409"
                  x="1204" y="173.3514">- &#12503;&#12540;&#12523;&#12469;&#12452;&#12474;&#12434;&#36229;&#12360;&#12427;&#22580;&#21512;&#12399;&#26032;&#35215;&#29983;&#25104;&#12377;&#12427;&#35373;&#35336;&#12290;&#24517;&#35201;&#12394;&#12425;&#19978;&#38480;&#12420;&#30772;&#26820;&#12509;&#12522;&#12471;&#12540;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.6646"
                  x="1204" y="190.6424">- &#22823;&#37327;&#12398;&#12509;&#12483;&#12503;&#12450;&#12483;&#12503;&#30330;&#29983;&#26178;&#12399;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12503;&#12540;&#12523;&#12398;&#12469;&#12452;&#12474;&#35519;&#25972;&#12391;
                GC &#12434;&#25233;&#12360;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1204" y="207.9334">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="691.5137"
                  x="1204" y="225.2244">- Methods are synchronized to ensure thread safety, but rendering must run on
                the Swing Event Dispatch Thread (EDT).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="722.687"
                  x="1204" y="242.5154">- When the pool is exhausted, new Popup instances are created; consider adding
                an upper bound or eviction policy if needed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="543.4165"
                  x="1204" y="259.8064">- Tune the pool size to reduce GC pressure when many popups are generated
                simultaneously.
            </text>
        </g>
