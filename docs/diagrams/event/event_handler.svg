            <path d="M947.188,6 L947.188,16 L957.188,16 L947.188,6" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="425" y="25.0283">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="475.9409"
                  x="425" y="42.3193">- &#12479;&#12452;&#12523;&#12372;&#12392;&#12398;&#12452;&#12505;&#12531;&#12488;&#30697;&#24418;&#12434;&#31649;&#29702;&#12375;&#12289;&#12503;&#12524;&#12452;&#12516;&#12540;&#12392;&#12452;&#12505;&#12531;&#12488;&#12398;&#34909;&#31361;&#12434;&#26908;&#20986;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.9409"
                  x="425" y="59.6104">- &#12452;&#12505;&#12531;&#12488;&#30330;&#29983;&#12398;&#38971;&#24230;&#12434;&#21046;&#24481;&#12375;&#12289;&#12480;&#12513;&#12540;&#12472;&#12394;&#12393;&#12398;&#21177;&#26524;&#12434;&#36969;&#29992;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="425" y="76.9014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.7158"
                  x="425" y="94.1924">- Manage per-tile event rectangles and detect player-event collisions.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.4395"
                  x="425" y="111.4834">- Control event triggering frequency and apply effects (e.g., damage).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="425" y="128.7744">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8862"
                  x="425" y="146.0654">Key responsibilities:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.4453"
                  x="425" y="163.3564">- FrameApp &#12398;&#23544;&#27861;&#12434;&#20351;&#12387;&#12390; eventRect[][]
                &#12434;&#21021;&#26399;&#21270;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.9409"
                  x="425" y="180.6475">- &#21069;&#22238;&#12398;&#12452;&#12505;&#12531;&#12488;&#12363;&#12425;&#12398;&#36317;&#38626;&#12434;&#12481;&#12455;&#12483;&#12463;&#12375;&#12390;&#21363;&#26178;&#20877;&#30330;&#29983;&#12434;&#38450;&#12368;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.4326"
                  x="425" y="197.9385">- &#34909;&#31361;&#12392;&#21521;&#12365;&#12398;&#19968;&#33268;&#12434;&#26908;&#20986;&#12375;&#12289;eventDone
                &#12434;&#35373;&#23450;&#12375;&#12390;&#21177;&#26524;&#12434;&#36969;&#29992;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="425" y="215.2295">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.5005"
                  x="425" y="232.5205">- Initialize eventRect[][] for all map tiles using FrameApp dimensions.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.2305"
                  x="425" y="249.8115">- Check distance from previous event to prevent immediate retrigger.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="449.4585"
                  x="425" y="267.1025">- Detect collision and direction match, then mark eventDone and apply effects.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="425" y="284.3936">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9307"
                  x="425" y="301.6846">Implementation considerations:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.1182"
                  x="425" y="318.9756">- &#34892;&#21015;&#12452;&#12531;&#12487;&#12483;&#12463;&#12473;&#65288;row/col&#65289;&#12398;&#25201;&#12356;&#12434;&#19968;&#36011;&#12373;&#12379;&#12427;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="517.188"
                  x="425" y="336.2666">- &#34909;&#31361;&#21028;&#23450;&#24460;&#12395; Player &#12398; solidArea
                &#12392; eventRect &#12398;&#20301;&#32622;&#12434;&#12522;&#12475;&#12483;&#12488;&#12377;&#12427;&#12371;&#12392;&#12434;&#24536;&#12428;&#12394;&#12356;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1646"
                  x="425" y="353.5576">- &#34909;&#31361;&#21028;&#23450;&#12420; UI &#12395;&#24433;&#38911;&#12377;&#12427;&#20966;&#29702;&#12399;&#36969;&#20999;&#12394;&#12473;&#12524;&#12483;&#12489;&#19978;&#12391;&#23455;&#34892;&#12377;&#12427;&#12371;&#12392;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="425" y="370.8486">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.8105"
                  x="425" y="388.1396">- Ensure indices (row/col) usage is consistent (row vs col ordering).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="417.2378"
                  x="425" y="405.4307">- Reset player's solidArea and eventRect positions after collision checks.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.0176"
                  x="425" y="422.7217">- Run collision and UI-affecting logic on appropriate thread if needed.
            </text>
        </g>
