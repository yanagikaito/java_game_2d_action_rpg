            <path d="M419,6 L419,214.5 L384.4,218.5 L419,222.5 L419,430.9844 A0,0 0 0 0 419,430.9844 L957.188,430.9844 A0,0 0 0 0 957.188,430.9844 L957.188,16 L947.188,6 L419,6 A0,0 0 0 0 419,6"
