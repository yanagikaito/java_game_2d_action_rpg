            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1287.5" y="351.2881">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="468.9775"
                  x="1287.5" y="368.5791">- Switch between random walking and following a predefined route for movement.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="795.5708"
                  x="1287.5" y="385.8701">- While following a route, move sequentially toward the next waypoint and
                relax the arrival check to allow reaching within the NPC&#8217;s speed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="630.0557"
                  x="1287.5" y="403.1611">- Detect collisions with the player using CollisionChecker; if a collision
                occurs, trigger the game-over behavior.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="572.3237"
                  x="1287.5" y="420.4521">- Load dialogue and trigger information from MapEvent and display the NPC&#8217;s
                dialogue accordingly.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.1694"
                  x="1287.5" y="437.7432">- Load sprites and resize them to the tile size for rendering and storage.
            </text>
