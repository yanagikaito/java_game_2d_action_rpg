                  x="1287.5" y="333.9971">- &#12473;&#12503;&#12521;&#12452;&#12488;&#12399;&#12479;&#12452;&#12523;&#12469;&#12452;&#12474;&#12395;&#12522;&#12469;&#12452;&#12474;&#12375;&#12390;&#20445;&#25345;&#12377;&#12427;&#12290;
