            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="528.7026"
                  x="1287.5" y="299.415">- &#12503;&#12524;&#12452;&#12516;&#12540;&#12392;&#12398;&#34909;&#31361;&#12434;
