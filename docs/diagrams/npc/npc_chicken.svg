            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="675.2954"
                  x="1808.5" y="884.2881">- callForHelp &#12399;&#12510;&#12483;&#12503;&#12398;&#19978;&#38480;&#12414;&#12391;&#36817;&#38563;&#12395;&#12481;&#12461;&#12531;&#12434;&#12473;&#12509;&#12540;&#12531;&#12373;&#12379;&#12289;&#12473;&#12509;&#12540;&#12531;&#12375;&#12383;&#12481;&#12461;&#12531;&#12434;&#12503;&#12524;&#12452;&#12516;&#12540;&#36861;&#23614;&#29366;&#24907;&#12395;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="618.9409"
                  x="1808.5" y="901.5791">- &#25342;&#12431;&#12428;&#12427;&#12539;&#25152;&#25345;&#12373;&#12428;&#12427;&#12539;&#25237;&#12370;&#12425;&#12428;&#12427;&#25369;&#21205;&#12434;&#12469;&#12509;&#12540;&#12488;&#12375;&#12289;&#25152;&#25345;&#26178;&#65295;&#25237;&#25842;&#26178;&#34920;&#31034;&#29992;&#12398;&#12473;&#12503;&#12521;&#12452;&#12488;&#12434;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1808.5" y="918.8701">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6543"
                  x="1808.5" y="936.1611">- Loads and resizes chicken sprites.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5596"
                  x="1808.5" y="953.4521">- Handles random walk, player-following, and thrown (physics) states.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="839.6299"
                  x="1808.5" y="970.7432">- While thrown, updates world position using vx/vy and vertical motion z/vz
                with gravity; on landing restores collision and pickable state after delay.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="458.1421"
                  x="1808.5" y="988.0342">- Detects player collisions and applies attack cooldown before damaging
                player.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="903.8682"
                  x="1808.5" y="1005.3252">- takeDamage applies knockback, enforces minimum life (cannot be killed),
                grants temporary invincibility, and may call callForHelp() to spawn more chickens.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.4521"
                  x="1808.5" y="1022.6162">- callForHelp spawns nearby chickens up to map limits and sets them to follow
                the player.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="485.5957"
                  x="1808.5" y="1039.9072">- Supports being picked up, held, thrown, and provides sprites for held/throw
                visuals.
            </text>
