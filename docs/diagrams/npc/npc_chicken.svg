                  x="1808.5" y="849.7061">- &#12503;&#12524;&#12452;&#12516;&#12540;&#12392;&#12398;&#34909;&#31361;&#12434;&#26908;&#20986;&#12375;&#12289;&#25915;&#25731;&#12463;&#12540;&#12523;&#12480;&#12454;&#12531;&#12434;&#36969;&#29992;&#12375;&#12383;&#19978;&#12391;&#12503;&#12524;&#12452;&#12516;&#12540;&#12395;&#12480;&#12513;&#12540;&#12472;&#12434;&#19982;&#12360;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="959.8862"
                  x="1808.5" y="866.9971">- takeDamage &#12399;&#12494;&#12483;&#12463;&#12496;&#12483;&#12463;&#12434;&#36969;&#29992;&#12375;&#12289;&#26368;&#23567;&#12521;&#12452;&#12501;&#12434;&#20445;&#35388;&#65288;&#20498;&#12379;&#12394;&#12356;&#65289;&#12289;&#19968;&#26178;&#30340;&#12394;&#28961;&#25973;&#12434;&#20184;&#19982;&#12375;&#12289;&#24517;&#35201;&#12394;&#12425;
