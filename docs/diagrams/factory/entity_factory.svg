                  x="1500" y="422.7217">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="554.2266"
                  x="1500" y="440.0127">- create() may return null for unknown typeIds; consider throwing an exception
                or using Optional.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="535.4121"
                  x="1500" y="457.3037">- MapEvent ev is currently null-initialized; provide a setter or constructor
                parameter if needed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="623.562"
                  x="1500" y="474.5947">- Consider centralizing configuration for typeId mappings (enum or registry) to
