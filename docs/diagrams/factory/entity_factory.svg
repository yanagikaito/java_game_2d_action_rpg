            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9307"
                  x="1500" y="353.5576">Implementation considerations:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="679.6943"
                  x="1500" y="370.8486">- &#26410;&#30693;&#12398; typeId &#12395;&#23550;&#12375;&#12390; create()
                &#12364; null &#12434;&#36820;&#12377;&#21487;&#33021;&#24615;&#12364;&#12354;&#12427;&#12383;&#12417;&#12289;&#20363;&#22806;&#12434;&#25237;&#12370;&#12427;&#12363;
                Optional &#12434;&#20351;&#12358;&#12371;&#12392;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="686.8862"
                  x="1500" y="388.1396">- MapEvent ev &#12364;&#29694;&#22312; null &#21021;&#26399;&#21270;&#12373;&#12428;&#12390;&#12356;&#12427;&#12383;&#12417;&#12289;&#24517;&#35201;&#12394;&#12425;&#12475;&#12483;&#12479;&#12540;&#12420;&#12467;&#12531;&#12473;&#12488;&#12521;&#12463;&#12479;&#24341;&#25968;&#12391;&#27880;&#20837;&#12391;&#12365;&#12427;&#12424;&#12358;&#12395;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="594.4136"
                  x="1500" y="405.4307">- &#22823;&#12365;&#12394; switch &#25991;&#12434;&#36991;&#12369;&#12427;&#12383;&#12417;&#12289;enum
                &#12420;&#12524;&#12472;&#12473;&#12488;&#12522;&#12395;&#12424;&#12427;&#12510;&#12483;&#12500;&#12531;&#12464;&#65288;&#35373;&#23450;&#12398;&#19968;&#20803;&#21270;&#65289;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
