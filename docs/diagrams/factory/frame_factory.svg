            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.2236"
                  x="835" y="59.6104">- &#12466;&#12540;&#12512;&#29992;&#12398; JFrame &#12434;&#29983;&#25104;&#12539;&#35373;&#23450;&#12377;&#12427;&#12501;&#12449;&#12463;&#12488;&#12522;&#12513;&#12477;&#12483;&#12489;&#12434;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.1836"
                  x="835" y="76.9014">- JFrame &#12434;&#27083;&#31689;&#12539;&#34920;&#31034;&#12377;&#12427;
                GameFrame&#65288;&#38306;&#25968;&#22411;&#12521;&#12483;&#12497;&#12540;&#65289;&#12434;&#36820;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="835" y="94.1924">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.7686"
                  x="835" y="111.4834">- Provide a factory method to create and configure a JFrame for the game.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.7495"
                  x="835" y="128.7744">- Return a GameFrame (functional wrapper) that constructs and shows the JFrame.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="835" y="146.0654">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8862"
                  x="835" y="163.3564">Key responsibilities:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="579.9409"
                  x="835" y="180.6475">- &#12501;&#12524;&#12540;&#12512;&#12398;&#12503;&#12525;&#12497;&#12486;&#12451;&#65288;&#12469;&#12452;&#12474;&#12289;&#12479;&#12452;&#12488;&#12523;&#12289;&#12487;&#12501;&#12457;&#12523;&#12488;&#12398;&#32066;&#20102;&#21205;&#20316;&#12289;&#12522;&#12469;&#12452;&#12474;&#21487;&#21542;&#65289;&#12434;&#35373;&#23450;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="444.1899"
                  x="835" y="197.9385">- GameWindow &#12467;&#12531;&#12509;&#12540;&#12493;&#12531;&#12488;&#12434;&#12501;&#12524;&#12540;&#12512;&#12395;&#36861;&#21152;&#12375;&#12289;&#30011;&#38754;&#20013;&#22830;&#12395;&#37197;&#32622;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.9136"
                  x="835" y="215.2295">- &#12501;&#12524;&#12540;&#12512;&#12434;&#21487;&#35222;&#21270;&#12375;&#12289;GameFrame.create()
                &#32076;&#30001;&#12391;&#36820;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="835" y="232.5205">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.9795"
                  x="835" y="249.8115">- Set frame properties: size, title, default close operation, resizable flag.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.7031"
                  x="835" y="267.1025">- Add GameWindow component to the frame and center it on screen.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.7915"
                  x="835" y="284.3936">- Make the frame visible and return it via GameFrame.create().
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="835" y="301.6846">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9307"
                  x="835" y="318.9756">Implementation considerations:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.1245"
                  x="835" y="336.2666">- &#36820;&#12373;&#12428;&#12427; GameFrame &#12399;&#12521;&#12512;&#12480;&#65295;&#38306;&#25968;&#22411;&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#12392;&#12375;&#12390;&#23455;&#35013;&#12373;&#12428;&#12390;&#12356;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="592.9409"
                  x="835" y="353.5576">- &#24517;&#35201;&#12395;&#24540;&#12376;&#12390;&#12479;&#12452;&#12488;&#12523;&#12420;&#12522;&#12469;&#12452;&#12474;&#21487;&#21542;&#12394;&#12393;&#12398;&#35373;&#23450;&#12434;&#22806;&#37096;&#12363;&#12425;&#22793;&#26356;&#12391;&#12365;&#12427;&#12424;&#12358;&#12395;&#12377;&#12427;&#12371;&#12392;&#12434;&#26908;&#35342;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="854.5405"
                  x="835" y="370.8486">- Swing &#12398;&#25805;&#20316;&#12399;&#12473;&#12524;&#12483;&#12489;&#23433;&#20840;&#12398;&#12383;&#12417;
                Event Dispatch Thread&#65288;EDT&#65289;&#19978;&#12391;&#23455;&#34892;&#12377;&#12427;&#12371;&#12392;&#12434;&#30906;&#35469;&#12377;&#12427;&#65288;SwingUtilities.invokeLater
                &#31561;&#12398;&#20351;&#29992;&#12434;&#26908;&#35342;&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="835" y="388.1396">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.5913"
                  x="835" y="405.4307">- The returned GameFrame is implemented as a lambda/functional object.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.6631"
                  x="835" y="422.7217">- Consider exposing configuration options (title, resizable) if needed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.2031"
                  x="835" y="440.0127">- Ensure Swing calls run on the Event Dispatch Thread (EDT) for thread safety.
            </text>
