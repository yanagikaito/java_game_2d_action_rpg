            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="642.7383"
                  x="504" y="266.0791">- Represents a destructible dry tree tile. In the constructor it sets
                destructible = true, blocking = true, and life = 6.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="539.7603"
                  x="504" y="283.3701">- Implements isCorrectItem to return true when the currently equipped weapon is
                an AxeType.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.5977"
                  x="504" y="300.6611">- Provides createDestroyedForm which returns an ItTrunk when the tree is
                destroyed.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="572.2285"
                  x="504" y="317.9521">- Provides particle parameter methods (color, size, speed, max life) and renders
                its image in draw().
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="553.4775"
                  x="504" y="335.2432">- Loads its image with ImageIO and uses FrameApp.getTileSize() to determine the
                drawing size.
            </text>
