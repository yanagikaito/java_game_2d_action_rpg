            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317"
                  x="788.5" y="25.0283">Purpose:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432.6118"
                  x="788.5" y="42.3193">- &#12510;&#12483;&#12503;&#19978;&#12398;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#65288;NPC/&#12514;&#12531;&#12473;&#12479;&#12540;/&#12458;&#12502;&#12472;&#12455;&#12463;&#12488;&#65289;&#12434;&#31649;&#29702;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.1899"
                  x="788.5" y="59.6104">- &#12473;&#12509;&#12540;&#12531;&#21028;&#23450;&#12289;&#25551;&#30011;&#38918;&#12477;&#12540;&#12488;&#12289;GameWindow
                &#12392;&#12398;&#31777;&#26131;&#21516;&#26399;&#12434;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="788.5" y="76.9014">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.3042"
                  x="788.5" y="94.1924">- Manage entities on the map (NPCs, monsters, objects).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="546.9585"
                  x="788.5" y="111.4834">- Provide spawn checks, drawing-order sorting, and simple synchronization with
                GameWindow.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="788.5" y="128.7744">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8862"
                  x="788.5" y="146.0654">Key responsibilities:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.1226"
                  x="788.5" y="163.3564">- &#20869;&#37096;&#12522;&#12473;&#12488; objects &#12434;&#20445;&#25345;&#12375;&#12289;addObject
                &#12391;&#36861;&#21152;&#24460;&#12395; Y &#24231;&#27161;&#12391;&#12477;&#12540;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="563.3735"
                  x="788.5" y="180.6475">- GameWindow &#12398; monster &#37197;&#21015;&#12408;&#12456;&#12531;&#12486;&#12451;&#12486;&#12451;&#12434;&#30331;&#37682;&#12539;&#12463;&#12522;&#12450;&#12377;&#12427;&#12518;&#12540;&#12486;&#12451;&#12522;&#12486;&#12451;&#12434;&#25552;&#20379;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.9409"
                  x="788.5" y="197.9385">- &#25351;&#23450;&#12463;&#12521;&#12473;&#12398;&#20491;&#25968;&#12459;&#12454;&#12531;&#12488;&#12420;&#37197;&#32622;&#21487;&#21542;&#21028;&#23450;&#65288;&#30697;&#24418;&#34909;&#31361;&#65289;&#12434;&#34892;&#12358;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="788.5" y="215.2295">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.6821"
                  x="788.5" y="232.5205">- Maintain the internal objects list and sort it by Y coordinate after
                addObject calls.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.4541"
                  x="788.5" y="249.8115">- Provide utilities to register and clear entities in GameWindow&#8217;s
                monster array.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="629.3828"
                  x="788.5" y="267.1025">- Count entities of a specified class and determine placement availability via
                rectangle-based collision checks.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="788.5" y="284.3936">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9307"
                  x="788.5" y="301.6846">Implementation considerations:
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="444.1899"
                  x="788.5" y="318.9756">- GameWindow &#12392;&#37197;&#21015;&#12434;&#20108;&#37325;&#31649;&#29702;&#12375;&#12390;&#12356;&#12427;&#12383;&#12417;&#12289;&#21516;&#26399;&#12511;&#12473;&#12395;&#27880;&#24847;&#12377;&#12427;&#12371;&#12392;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="496.228"
                  x="788.5" y="336.2666">- gameWindow &#12364; null &#12395;&#12394;&#12427;&#21487;&#33021;&#24615;&#12364;&#12354;&#12427;&#12383;&#12417;&#12289;&#21628;&#12403;&#20986;&#12375;&#21069;&#12395;
                null &#12481;&#12455;&#12483;&#12463;&#12364;&#24517;&#35201;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="553.9409"
                  x="788.5" y="353.5576">- &#34909;&#31361;&#21028;&#23450;&#12399;&#21336;&#32020;&#12394;&#30697;&#24418;&#21028;&#23450;&#12398;&#12383;&#12417;&#12289;&#12479;&#12452;&#12523;&#36890;&#34892;&#21028;&#23450;&#12420;&#12510;&#12483;&#12503;&#22659;&#30028;&#12481;&#12455;&#12483;&#12463;&#12399;&#21029;&#36884;&#23455;&#35013;&#12364;&#24517;&#35201;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="788.5" y="370.8486">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="656.8491"
                  x="788.5" y="388.1396">- Be careful of synchronization issues because entity storage is duplicated
                between GameMap and GameWindow.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="481.9141"
                  x="788.5" y="405.4307">- gameWindow may be null; always perform null checks before accessing its
                arrays.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="726.9209"
                  x="788.5" y="422.7217">- Collision checks use simple rectangle intersection; implement tile
                passability and map-boundary checks separately if needed.
            </text>
        </g><!--link GameMap to GameWindow-->
