        <g class="entity" id="ent0055">
            <path d="M3288.5,338.5137 L3288.5,590.5879 L3891.8975,590.5879 L3891.8975,348.5137 L3881.8975,338.5137 L3288.5,338.5137"
                  fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
            <path d="M3881.8975,338.5137 L3881.8975,348.5137 L3891.8975,348.5137 L3881.8975,338.5137" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:1;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="3294.5" y="357.542">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="523.707"
                  x="3294.5" y="374.833">- saveGame &#12399; H2 DB &#12434;&#20351;&#12356;&#12488;&#12521;&#12531;&#12470;&#12463;&#12471;&#12519;&#12531;&#20869;&#12391;&#23455;&#34892;&#65288;conn.setAutoCommit(false)&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.3926"
                  x="3294.5" y="392.124">- saveMainData &#12399; MERGE INTO &#12434;&#20351;&#12387;&#12390; saves
                &#12486;&#12540;&#12502;&#12523;&#12434;&#26356;&#26032;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="552.6523"
                  x="3294.5" y="409.415">- clearInventory &#12399; inventory_items &#12398;&#35442;&#24403; save_id
                &#12434;&#21066;&#38500;&#12375;&#12390;&#12363;&#12425; saveInventory &#12391;&#25407;&#20837;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.376"
                  x="3294.5" y="426.7061">- saveInventory &#12399; buildItemSaveDataList &#12391;&#20998;&#21106;&#12373;&#12428;&#12383;
                ItemSaveData &#12434;&#12496;&#12483;&#12481;&#25407;&#20837;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="520.1206"
                  x="3294.5" y="443.9971">- saveEquipmentItem &#12399; MERGE INTO &#12434;&#20351;&#12356;&#35013;&#20633;&#65288;weapon/shield&#65289;&#12434;&#23433;&#20840;&#12395;&#20445;&#23384;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="517.8608"
                  x="3294.5" y="461.2881">- writeMeta &#12399; JSON &#12434;&#19968;&#26178;&#12501;&#12449;&#12452;&#12523;&#12395;&#26360;&#12365;&#12289;&#21407;&#23376;&#31227;&#21205;&#12391;&#20445;&#23384;&#12377;&#12427;&#65288;ATOMIC_MOVE&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="3294.5" y="478.5791">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.1187"
                  x="3294.5" y="495.8701">- saveGame runs inside an H2 DB transaction (conn.setAutoCommit(false)).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2178"
                  x="3294.5" y="513.1611">- saveMainData updates the saves table using MERGE INTO.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="582.3975"
                  x="3294.5" y="530.4521">- clearInventory deletes inventory_items for the given save_id before
                saveInventory inserts new rows.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.3467"
                  x="3294.5" y="547.7432">- saveInventory batch-inserts ItemSaveData produced by buildItemSaveDataList.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="497.0977"
                  x="3294.5" y="565.0342">- saveEquipmentItem uses MERGE INTO to safely persist equipment
                (weapon/shield).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="498.4561"
                  x="3294.5" y="582.3252">- writeMeta writes JSON to a temporary file and moves it atomically
                (ATOMIC_MOVE).
            </text>
        </g>
        <g class="entity" id="ent0058">
            <path d="M1218,49.0137 L1218,119.0137 L1182.7,123.0137 L1218,127.0137 L1218,197.3418 A0,0 0 0 0 1218,197.3418 L2222.4614,197.3418 A0,0 0 0 0 2222.4614,197.3418 L2222.4614,59.0137 L2212.4614,49.0137 L1218,49.0137 A0,0 0 0 0 1218,49.0137"
