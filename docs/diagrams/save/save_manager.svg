                  x="1221.5" y="1701.2061">- ItemSaveData is modeled as a Java record (an immutable data carrier).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.9814"
                  x="1221.5" y="1718.4971">- Represents an inventory slot entry (slot, typeId, count).
