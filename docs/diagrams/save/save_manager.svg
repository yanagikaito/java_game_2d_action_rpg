            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="913.7388"
                  x="1224" y="85.333">- loadEquipment &#12399;&#12414;&#12378;&#12452;&#12531;&#12505;&#12531;&#12488;&#12522;&#20869;&#12391;&#21516;&#19968;
                typeId &#12398;&#12450;&#12452;&#12486;&#12512;&#12434;&#25506;&#12375;&#35013;&#20633;&#12395;&#21106;&#24403;&#12390;&#12289;&#35211;&#12388;&#12363;&#12425;&#12394;&#12369;&#12428;&#12400;
                EntityFactory.create &#12391;&#29983;&#25104;&#12375;&#12390;&#35013;&#20633;&#12395;&#12475;&#12483;&#12488;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.2134"
                  x="1224" y="102.624">- findEntityTypeById &#12399; typeId &#12434;&#20855;&#20307;&#30340;&#12394;
                EntityType &#12463;&#12521;&#12473;&#12395;&#12510;&#12483;&#12500;&#12531;&#12464;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="517.5752"
                  x="1224" y="119.915">- determineMaxStackForType &#12399;&#12509;&#12540;&#12471;&#12519;&#12531;&#31561;&#12398;&#12473;&#12479;&#12483;&#12463;&#19978;&#38480;&#12434;&#36820;&#12377;&#65288;&#20363;:
                7,8,9 -&gt; 99&#65289;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="1224" y="137.2061">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="983.4614"
                  x="1224" y="154.4971">- loadEquipment first searches the inventory for an item with the same typeId
                and assigns it as equipment; if not found, it creates one via EntityFactory.create and equips it.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.3149"
                  x="1224" y="171.7881">- findEntityTypeById maps numeric typeId values to concrete EntityType classes.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="524.1577"
                  x="1224" y="189.0791">- determineMaxStackForType returns stack limits for item types (e.g., typeIds 7,
                8, 9 -&gt; 99).
            </text>
        </g>
