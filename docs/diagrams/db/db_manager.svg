            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="517" y="193.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.3418"
                  x="517" y="210.333">- H2 &#12398; JDBC &#25509;&#32154;&#12392;&#12473;&#12461;&#12540;&#12510;&#21021;&#26399;&#21270;&#12518;&#12540;&#12486;&#12451;&#12522;&#12486;&#12451;&#12434;&#25552;&#20379;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="791.0703"
                  x="517" y="227.624">- initSchema &#12399; map_tile&#12289;map_path&#12289;saves&#12289;inventory_items&#12289;equipment&#12289;map_event
                &#12398;&#21508;&#12486;&#12540;&#12502;&#12523;&#12434;&#23384;&#22312;&#12375;&#12394;&#12356;&#22580;&#21512;&#12395;&#20316;&#25104;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="625.5615"
                  x="517" y="244.915">- getConnection &#12399;&#35373;&#23450;&#12373;&#12428;&#12383; URL&#65295;&#12518;&#12540;&#12470;&#12540;&#65295;&#12497;&#12473;&#12527;&#12540;&#12489;&#12434;&#20351;&#12387;&#12390;&#26032;&#12375;&#12356;
                JDBC Connection &#12434;&#36820;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="530.2261"
                  x="517" y="262.2061">- &#12473;&#12461;&#12540;&#12510;&#12399; SaveManager&#65295;LoadManager
                &#12364;&#26399;&#24453;&#12377;&#12427; MERGE &#12420;&#22806;&#37096;&#12461;&#12540;&#12434;&#21033;&#29992;&#12375;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="517" y="279.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068"
                  x="517" y="296.7881">- Provides H2 JDBC connection and schema initialization utilities.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="629.3701"
                  x="517" y="314.0791">- initSchema creates tables if not exists: map_tile, map_path, saves,
                inventory_items, equipment, map_event.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.4839"
                  x="517" y="331.3701">- getConnection returns a new JDBC Connection using configured URL/user/password.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.4058"
                  x="517" y="348.6611">- Schema uses MERGE/foreign keys expected by SaveManager/LoadManager.
            </text>
        </g>
