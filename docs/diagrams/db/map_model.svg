        <g class="entity" id="ent0010">
            <path d="M463.5,134.5137 L463.5,230.5137 L428.88,234.5137 L463.5,238.5137 L463.5,334.7148 A0,0 0 0 0 463.5,334.7148 L1084.2393,334.7148 A0,0 0 0 0 1084.2393,334.7148 L1084.2393,144.5137 L1074.2393,134.5137 L463.5,134.5137 A0,0 0 0 0 463.5,134.5137"
                  fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
            <path d="M1074.2393,134.5137 L1074.2393,144.5137 L1084.2393,144.5137 L1074.2393,134.5137" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="469.5" y="153.542">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2935"
                  x="469.5" y="170.833">Implementation notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.7734"
                  x="469.5" y="188.124">- events &#12399; id -&gt; MapEvent &#12398;&#39640;&#36895;&#26908;&#32034;&#29992;
                Map&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.1436"
                  x="469.5" y="205.415">- allEvents &#12399;&#38918;&#24207;&#20445;&#25345;&#65288;&#34920;&#31034;&#12420;&#26908;&#32034;&#38918;&#24207;&#12398;&#20445;&#35388;&#65289;&#29992;
                List&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.1035"
                  x="469.5" y="222.7061">- loadEventsFromDb &#12399; DB &#12363;&#12425;&#35501;&#12415;&#36796;&#12415;&#12289;&#20001;&#26041;&#12398;&#12467;&#12524;&#12463;&#12471;&#12519;&#12531;&#12434;&#26356;&#26032;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="534.5933"
                  x="469.5" y="239.9971">- JSON &#12501;&#12451;&#12540;&#12523;&#12489;&#12399; Jackson(ObjectMapper)
                &#12391; MapEvent &#12398; dialogues/meta &#12434;&#24489;&#20803;&#12377;&#12427;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="469.5" y="257.2881">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.937"
                  x="469.5" y="274.5791">- events is a Map for fast lookup by id.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.3887"
                  x="469.5" y="291.8701">- allEvents is a List that preserves order (for display/search ordering).
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.874"
                  x="469.5" y="309.1611">- loadEventsFromDb loads from the DB and updates both collections.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="599.7393"
                  x="469.5" y="326.4521">- JSON fields are restored into MapEvent.dialogues and MapEvent.meta using
                Jackson (ObjectMapper).
            </text>
        </g>
        <g class="entity" id="ent0013">
            <path d="M465,1009.0137 L465,1096.5137 L429.85,1100.5137 L465,1104.5137 L465,1191.9238 A0,0 0 0 0 465,1191.9238 L966.5493,1191.9238 A0,0 0 0 0 966.5493,1191.9238 L966.5493,1019.0137 L956.5493,1009.0137 L465,1009.0137 A0,0 0 0 0 465,1009.0137"
