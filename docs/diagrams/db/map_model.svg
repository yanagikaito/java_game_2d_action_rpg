            <path d="M956.5493,1009.0137 L956.5493,1019.0137 L966.5493,1019.0137 L956.5493,1009.0137" fill="#FEFFDD"
                  style="stroke:#181818;stroke-width:0.5;"/>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="36.1182" x="471" y="1028.042">Notes
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.8799"
                  x="471" y="1045.333">- map_event &#12486;&#12540;&#12502;&#12523;&#12398;&#34892;&#12434;&#34920;&#29694;&#12377;&#12427;
                POJO&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.4946"
                  x="471" y="1062.624">- trigger &#12398;&#20516;&#20363;: "interact", "touch", "auto"&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.3335"
                  x="471" y="1079.915">- dialogues &#12399;&#38918;&#24207;&#20184;&#12365;&#12398;&#21488;&#35422;&#12522;&#12473;&#12488;&#12289;meta
                &#12399;&#25313;&#24373;&#21487;&#33021;&#12394;&#12461;&#12540;/&#20516;&#12510;&#12483;&#12503;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.5527"
                  x="471" y="1097.2061">- &#24341;&#25968;&#12394;&#12375;&#12467;&#12531;&#12473;&#12488;&#12521;&#12463;&#12479;&#12399;&#12471;&#12522;&#12450;&#12521;&#12452;&#12474;/&#12487;&#12471;&#12522;&#12450;&#12521;&#12452;&#12474;&#29992;&#12395;&#27531;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="471" y="1114.4971">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.7705"
                  x="471" y="1131.7881">- Represents a row in the map_event table as a POJO.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.8745"
                  x="471" y="1149.0791">- Example trigger values: "interact", "touch", "auto".
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="480.5493"
                  x="471" y="1166.3701">- dialogues is an ordered list of dialogue lines; meta is an extensible
                key/value map.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.5469"
                  x="471" y="1183.6611">- No-arg constructor is retained for serialization/deserialization.
            </text>
        </g>
