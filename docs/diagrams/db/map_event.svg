            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3716"
                  x="1128" y="483.333">Schema mapping (map_event):
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.8208"
                  x="1128" y="500.624">- id VARCHAR(64) PRIMARY KEY
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.1309"
                  x="1128" y="517.915">- map_id INT
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.9937"
                  x="1128" y="535.2061">- x INT
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.9937"
                  x="1128" y="552.4971">- y INT
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.9854"
                  x="1128" y="569.7881">- name VARCHAR(255)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.8862"
                  x="1128" y="587.0791">- trigger_type VARCHAR(32)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3442"
                  x="1128" y="604.3701">- json CLOB (can contain dialogues/meta)
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8208"
                  x="1128" y="621.6611">- created_at TIMESTAMP
            </text>
