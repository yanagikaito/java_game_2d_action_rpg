                JSON&#65288;Jackson/Gson&#65289;&#12395;&#12424;&#12427;&#12487;&#12471;&#12522;&#12450;&#12521;&#12452;&#12474;&#12398;&#12383;&#12417;&#12395;&#27531;&#12373;&#12428;&#12390;&#12356;&#12414;&#12377;&#12290;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118"
                  x="471" y="552.5791">&#160;
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2031"
                  x="471" y="569.8701">- Represents an in-game map event stored in map_event table.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3291"
                  x="471" y="587.1611">-
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="41.1709" x="478.9409" y="587.1611">trigger
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.2837"
                  x="523.7236" y="587.1611">values: "interact", "touch", "auto".
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3291"
                  x="471" y="604.4521">-
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="60.6772" x="478.9409" y="604.4521">dialogues
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.106"
                  x="543.23" y="604.4521">holds ordered dialogue lines for the event.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3291"
                  x="471" y="621.7432">-
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="297.6035" x="478.9409" y="621.7432">questOffered / questAccepted / questCompleted
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.9033"
                  x="780.1563" y="621.7432">track quest state related to the event.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3291"
                  x="471" y="639.0342">-
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing"
                  textLength="30.3481" x="478.9409" y="639.0342">meta
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.0532"
                  x="512.9009" y="639.0342">is an extensible key/value map for arbitrary event data.
            </text>
            <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.2178"
                  x="471" y="656.3252">- No-arg constructor retained for JSON (Jackson/Gson) deserialization.
            </text>
        </g>
